  - 차이는 이거였어요. 시스코는 인터넷 길을 까는 장비를 팔았고, 길이 다 깔리자 주문이 뚝 끊겼어요. 2001년엔 안 팔린 재고만 22억 달러어치를 버렸죠.
  - 반면 아마존은, 그 깔린 길 위에서 장사를 하는 회사였어요.
  - 정리하면, 거품은 꺼져도 인터넷은 남았고, 그 길을 쓰는 쪽이 결국 금광 주인이 된 거예요.
