- type: duel
  chapter: 그때의 엔비디아
  heading: 금 캐는 사람 말고, 곡괭이 파는 사람
  highlight: 곡괭이
  left: {title: 2000 · 시스코, value: 인터넷 길을 까는 장비, sub: '라우터 · 모든 회사가 줄 서서 삼', color: up, 'on': 1}
  right: {title: 2026 · 엔비디아, value: AI를 공부시키는 칩, sub: 'GPU · 모든 빅테크가 줄 서서 삼', color: up, 'on': 2}
  narration:
  - 시스코가 뭘 파는 회사였냐면요. 골드러시 때 금을 캐러 몰려든 사람들 말고, 그 사람들한테 곡괭이를 판 사람을 떠올려 보세요. 인터넷 회사들이 금을 캘 때, 시스코는 인터넷 길을 까는 장비, 라우터를 팔았어요.
  - 지금 엔비디아도 똑같아요. 빅테크들이 에이아이라는 금을 캘 때, 그 곡괭이인 에이아이 칩을 파는 거죠. 누가 금을 캐든, 곡괭이 장수는 돈을 번다. 그래서 다들 샀어요.
