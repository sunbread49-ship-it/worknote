  title: 연봉 0원 회장님이 1년에 3,909억 받는 법 (이재용 · 정의선 · 최태원 · 구광모)
  description: |-
    이재용 회장 연봉은 0원. 그런데 작년에 받은 돈은 4대 그룹 회장님 중 1등, 3,909억 원입니다. 금융감독원 전자공시(DART) 사업보고서로 삼성 · SK · 현대차 · LG 회장님 연봉과 배당금을 숫자로 열어 봤습니다.

    ✔ 2025년 연봉: 정의선 174.6억(현대차 90 · 기아 54 · 모비스 30.6) · 최태원 82.5억 · 구광모 71.3억 · 이재용 0원(2017년 3월부터 무보수)
    ✔ 2025년 배당금: 이재용 3,909억 · 정의선 1,930억 · 최태원 1,038억 · 구광모 778억 → 배당이 연봉의 11~13배
    ✔ 정의선 회장 배당 1등 회사는 현대차가 아니라 현대글로비스(지분 20% · 870억)
    ✔ SK하이닉스 17배 상승, 그런데 최태원 회장 직접 보유는 0주 (SK 17.9% → SK스퀘어 → 하이닉스)
    ✔ 삼성 일가 상속세 12조, 5년 6회 분납 · 2026년 4월 완납
    ✔ 회장님 1주 = 내 1주: 삼성전자 1주 배당 1,668원 · 배당수익률 1위 기아 7.8%
    ✔ 월 30만 원 배당(세전): 기아 4,632만 원 vs 삼성전자 3억 9천만 원

    여러분이 회장님 회사 하나를 고른다면, 어디 주식을 사시겠어요? 댓글로 남겨 주세요.

    📌 주식 악어새 구독하고 다음 숫자 이야기도 받아보세요.

    ※ 본 영상은 투자 교육 목적이며, 특정 종목의 매수 · 매도 추천이 아닙니다. 배당은 회사 실적에 따라 바뀌며, 과거 배당이 미래를 보장하지 않습니다.
    ※ 연봉은 각 사 2025 사업보고서 개인별 보수, 배당금은 2025 회계연도 주당 배당 × 2025.12.31 보유 주식(상장 주요 계열사 기준)으로 계산했습니다. 배당수익률 · 주가는 2026년 11월 20일 종가 기준입니다.

