  - 여러분이라면 멈춘 지구의 어디에 살래요? 낮 쪽, 밤 쪽, 아니면 경계의 띠? 댓글로 알려 주세요.
  - 구독과 좋아요는 다음 지식 제작에 큰 힘이 됩니다.
