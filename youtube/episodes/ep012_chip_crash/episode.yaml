  narration: ['공포는 늘 짧고 강하게 오지만, 반도체의 사이클은 그보다 훨씬 길게 움직였어요.', '여러분은 이번 반도체 급락, 2000년일 것 같으세요, 2022년일 것 같으세요? | 댓글로 생각을 남겨 주세요.', '다음엔 어떤 걸 숫자로 확인해 볼까요? 궁금한 주제나 종목도 같이 남겨 주시면, 데이터로 끝까지 파헤쳐 드리겠습니다.', '구독과 좋아요는, 영상 분석과 제작에 큰 힘이 됩니다.', '오늘도 감 말고, 숫자로 투자하세요.']
