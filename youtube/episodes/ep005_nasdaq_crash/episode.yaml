  description: |
    2026년 11월 5일, 나스닥100이 하루에 6.36% 빠졌습니다. TQQQ는 하루 -19%.
    1985년 이후 나스닥100이 하루에 6% 넘게 빠진 날은 이번이 37번째입니다.
    과거 36번의 폭락 뒤 1년, 실제로 어떻게 됐는지 데이터로 전부 확인했습니다.

    ✔ 폭락 다음 1년, 36번 중 몇 번이 플러스였나
    ✔ 똑같은 -6%인데 결과가 갈린 이유 (2000년 닷컴 버블 vs 나머지)
    ✔ 폭락장에 팔고 나왔다면 놓친 것 (최고의 날 20일 중 18일의 비밀)
    ✔ 한 번에 vs 나눠서, 2008·2020·2000년에 직접 해 보면
    ✔ 폭락을 기회로 만든 사람들의 공통점

    궁금한 종목, 주제, 매매법을 댓글로 남겨 주세요. 다음 영상에서 숫자로 풀어 드립니다.
    📌 주식 악어새 구독하고 다음 백테스트도 받아보세요.

