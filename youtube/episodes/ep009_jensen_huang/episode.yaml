  title: 접시닦이 소년이 만든 세계 1위 회사 · 젠슨 황 33년, 주가 4,975배 뒤에 숨은 -90%
  description: '1993년, 미국의 한 패밀리 레스토랑 구석 자리에서 엔지니어 세 명이 회사를 차립니다.

    30여 년 뒤, 그 회사는 세계 최초로 시가총액 5조 달러를 넘깁니다. 엔비디아, 그리고 젠슨 황.


    ✔ 아홉 살 이민, 화장실 청소, 식당 접시닦이 소년

    ✔ 창업 3년 만에 ''30일 뒤 망하는 회사''가 된 이유

    ✔ 모두가 반대한 10년짜리 베팅, CUDA

    ✔ 게임 칩이 AI의 심장이 되기까지

    ✔ 상장 첫날 100만 원 → 49.7억 원, 그런데 그사이 -90%, -85%, -66%


    궁금한 인물, 종목, 매매법을 댓글로 남겨 주세요. 다음 영상에서 숫자로 풀어 드립니다.

    📌 주식 악어새 구독하고 다음 이야기도 받아보세요.


    ※ 본 영상은 투자 교육 목적의 콘텐츠이며, 엔비디아를 포함한 특정 종목의 매수·매도 추천이 아닙니다.

    ※ 과거 데이터가 미래 수익을 보장하지 않습니다. 개별 종목은 지수보다 훨씬 크게 움직일 수 있습니다.


