  - h: 浦
    ko: 포 · 포구
    ex: 마포 · 영등포 · 목포
    'on': 3
  - h: 島
    ko: 도 · 섬
    ex: 여의도 · 제주도
    'on': 4
  - h: 潭
    ko: 담 · 못
    ex: 청담 · 백담사
    'on': 5
  - h: 峙
    ko: 치 · 고개
    ex: 대치 · 한티
    'on': 6
  narration:
  - 여기까지 왔으면, 꿀팁 하나 챙겨 가세요. 이 다섯 글자만 알면, 처음 가는 동네 이름도 읽혀요.
  - 진은 나루. 노량진, 양화진.
  - 포는 포구. 마포, 영등포, 그리고 목포까지.
  - 도는 섬. 여의도, 제주도.
  - 담은 못. 청담동, 그리고 설악산 백담사.
  - 치는 고개. 대치동, 그래서 한티예요.
