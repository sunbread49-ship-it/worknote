youtube:
  title: "트럼프 레임덕 + 여소야대, 주식은 떨어질까? 76년 데이터로 본 결과"
  description: |
    2026년 11월 3일 중간선거, 민주당이 상원과 하원을 모두 가져갔습니다(11월 6일 보도 기준).
    트럼프 대통령의 남은 2년은 레임덕에 여소야대. 그럼 주식시장엔 악재일까요?
    1950년부터 76년 치 S&P500 데이터로 정부 구성별 수익률, 역대 레임덕 5번, 셧다운까지 확인했습니다.

    ✔ 대통령·의회 조합 5가지, 어느 쪽 주가가 가장 좋았나
    ✔ '꼴찌' 조합이 하필 지금? 숫자 뒤에 숨은 진짜 이유
    ✔ 역대 레임덕 5번, 놀랍게도 전부 같은 상황이었다
    ✔ 레임덕 2년 안에 숨어 있던 -33%, -46%
    ✔ 2028년, 현직 대통령이 못 나오는 대선 해의 주가
    ✔ 셧다운 5번, 그때 주가는?

    궁금한 종목, 주제, 매매법을 댓글로 남겨 주세요. 다음 영상에서 숫자로 풀어 드립니다.
    📌 주식 악어새 구독하고 다음 백테스트도 받아보세요.

    ※ 본 영상은 투자 교육 목적의 콘텐츠이며, 특정 종목·ETF의 매수·매도 추천이 아니고, 특정 정당을 지지하지 않습니다.
    ※ 과거 데이터가 미래 수익을 보장하지 않습니다. 투자 판단과 책임은 본인에게 있습니다.

    [자료] S&P500 일간 종가(배당 제외) · 나스닥100 · 연간 수익률은 달력 연도 기준(1950~2025)
    정부 구성: 대통령 소속 정당 + 상·하원 다수당 (2001년은 상원 다수당이 중간에 바뀌어 '의회 분할'로 분류)
    레임덕: 재선 대통령 임기 6년 차 중간선거일(1958·1986·1998·2006·2014) → 다음 대선일
    셧다운: 1995.11 · 1995.12~96.1 · 2013.10 · 2018.12~19.1 · 2025.10~11 (시작 전날 종가 → 종료일 종가)
    2026 중간선거 결과: AP·CBS·CNBC 11월 4~6일 보도 기준
  tags: [중간선거, 레임덕, 여소야대, 트럼프, 미국주식, S&P500, 나스닥, 셧다운, 대통령임기, 백테스트]
