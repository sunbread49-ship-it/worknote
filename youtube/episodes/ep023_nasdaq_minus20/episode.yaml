youtube:
  title: 나스닥 -20%, 지금 사면? 과거 9번 이때 산 사람들의 결말
  description: '나스닥이 10월 6일 고점 대비 약 20% 빠졌어요. 지금 현금을 넣어도 될까요? 지난 40년 동안 나스닥100이 직전 고점 대비 -20%를 처음 찍은 날은 딱 9번. 그날 1,000만 원을 넣었다면 어떻게 됐는지 데이터로 따라가 봤습니다.


    ✔ 금방 돌아온 4번: 1998 러시아 · 2018 무역전쟁 · 2020 코로나 · 2025 관세 (추가 하락 4% 이내)

    ✔ 더 빠진 3번: 1987 블랙먼데이 · 1990 걸프전 · 2022 금리 쇼크

    ✔ 악몽 2번: 2008 금융위기(추가 -42%) · 2000 닷컴버블(추가 -78%, 원금까지 13년 10개월)

    ✔ 원금 회복까지 걸린 시간 · 1년 뒤 성적표 (9번 중 6번 플러스)

    ✔ 한 번에 vs 6개월 나눠 사기 비교

    ✔ 지금 현금 넣기 전 확인할 세 가지


    여러분은 지금 사시겠어요, 나눠서 사시겠어요, 더 기다리시겠어요? 댓글로 남겨 주세요.


