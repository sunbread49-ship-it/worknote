  title: 코스피 일주일 -11.7%, 정말 미국 따라 무너진 걸까? 36년 데이터로 본 한·미 증시
  description: '고래 싸움에 새우 등 터진다. 이번 주 코스피가 딱 그랬습니다.

    미국 AI주가 흔들리자 일주일 만에 -11.7%, 서킷브레이커까지.

    그런데 한국 증시는 정말 미국의 그림자일까요? 1990년부터 36년 치 데이터로 확인했습니다.


    ✔ 미국이 기침하면 한국은 감기에 걸릴까? (상관계수 0.15 → 0.41)

    ✔ 나스닥이 하룻밤 -5% 빠지면, 다음 날 코스피는?

    ✔ 내릴 땐 더 따라가고, 오를 땐 덜 따라간다

    ✔ 그림자가 떨어져 나간 해: 1997년, 2024년, 2025년

    ✔ 한 주 -10% 폭락 16번, 그 뒤 1년과 3년

    ✔ 고점 대비 -40% 하락 다섯 번, 회복까지 걸린 시간


    궁금한 종목, 주제, 매매법을 댓글로 남겨 주세요. 다음 영상에서 숫자로 풀어 드립니다.

    📌 주식 악어새 구독하고 다음 백테스트도 받아보세요.


    ※ 본 영상은 투자 교육 목적의 콘텐츠이며, 특정 종목·ETF의 매수·매도 추천이 아닙니다.

    ※ 과거 데이터가 미래 수익을 보장하지 않습니다. 배당·세금·수수료·환율은 반영하지 않았습니다. 투자 판단과 책임은 본인에게 있습니다.


    [자료] 코스피 일간 종가(1990.1~2026.11.6) · S&P500 · 나스닥100 일간 종가(~2026.11.5) · 배당 제외

