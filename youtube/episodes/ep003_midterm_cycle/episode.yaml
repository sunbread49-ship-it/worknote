    ✔ 대통령 임기 4년, 해마다 성적은 어땠나
    ✔ 중간선거 날 사서 1년 들고 있었다면 (1950~2022, 19번)
    ✔ 중간선거부터 대선까지 2년만 투자하는 매매법의 결과
    ✔ 그런데 그냥 계속 들고 있었다면? (반전)
    ✔ 이 통계를 믿기 전에 꼭 알아야 할 함정

    궁금한 종목, 주제, 매매법을 댓글로 남겨 주세요. 다음 영상에서 숫자로 풀어 드립니다.
    📌 @antcalc 구독하고 다음 백테스트도 받아보세요.

