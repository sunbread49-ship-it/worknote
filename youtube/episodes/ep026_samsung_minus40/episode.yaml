youtube:
  title: 삼성전자 반토막, 과거 -40% 땐 어땠을까? 고점에 버틴 사람 vs 바닥에 산 사람
  description: |-
    삼성전자가 6월 고점 362,500원에서 17만 원대까지, 반토막이 났습니다.
    과거에도 삼성전자가 고점에서 -40% 넘게 빠진 적이 있었어요. 그때 ① 고점에 사서 끝까지 버틴 사람 ② -40% 찍은 날 새로 산 사람은 어떻게 됐을까요?

    ✔ 2008 금융위기 · 2022 반도체 겨울 · 1992: 금방 돌아온 때
    ✔ 1996 IMF · 2000 닷컴: -40%에서 또 반이 빠진 때
    ✔ 고점에 버틴 사람이 원금을 찾기까지 걸린 시간
    ✔ 그렇다면 지금은? 13만 원 · 10만 원이 의미하는 것

    자료: 삼성전자 일간 종가(네이버 금융, 액면분할 반영) · 삼성전자 2026년 3분기 실적 발표 · 언론 보도(2026.10~11)
    ※ 계산은 배당 · 세금 제외. 본 영상은 투자 교육 목적이며 매수 · 매도 추천이 아닙니다. 과거 수익률이 미래 수익을 보장하지 않습니다.
