  note_hl: 1,535만 원
  note_on: 3
  narration:
  - 2022년 반도체 겨울은 달랐어요. 2021년 1월 9만 1천 원에 산 버팀이는, 바닥까지 3년 10개월을 끌려 내려갔어요.
  - 원금을 찾은 건 2025년 10월. 무려 4년 9개월이 걸렸어요.
  - 그 사이 -40%에 들어간 줍줍이는 3년 뒤 1,535만 원. 같은 회사인데 결말이 이렇게 달라요.
