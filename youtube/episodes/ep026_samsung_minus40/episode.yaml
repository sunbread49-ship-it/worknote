# ── 그렇다면 지금은 ──
- type: vbars
  chapter: 그렇다면 지금은
  title: -40% 찍고, 얼마나 더 빠졌나
  highlight: 얼마나 더
  vmax: 60
  base_y: 800
  rows:
  - {label: '2008', value: 1, text: '0%'}
  - {label: '1992', value: 4, text: '-4%'}
  - {label: '2022', value: 8, text: '-8%'}
  - {label: 지금, value: 20, text: '-20%', hl: true}
  - {label: '2000', value: 37, text: '-37%'}
  - {label: '1996', value: 52, text: '-52%'}
  note: '-40% 첫날 종가 대비 이후 최저점 · 지금은 11.25 종가'
  narration:
  - 그렇다면 지금은 어디쯤일까요? 이번엔 7월 말에 -40%를 찍었어요. 20만 8천 원이요.
  - 거기서 벌써 20%가 더 빠졌어요. 금방 돌아온 때는 0에서 8%였는데, 지금은 이미 그걸 넘었어요. 남은 건 2000년과 1996년 쪽이에요.
