  - {text: 국민주식 삼성전자 반토막, highlight: 반토막, 'on': 2, size: 110}
  narration:
  - 삼성전자 갖고 계신 분들, 요즘 앱 열기 무서우시죠? 36만 원 하던 주식이 17만 원이 됐어요.
  - 며칠 전엔 하루에만 10% 가까이 빠졌죠. 국민주식이 반토막이에요.
- type: chart
