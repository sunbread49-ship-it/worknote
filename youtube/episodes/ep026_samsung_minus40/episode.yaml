  narration:
  - 그런데 두 번은 완전히 달랐어요. 줍줍이가 들어간 뒤에, 거기서 또 반이 날아갔거든요.
- type: punch
  chapter: 더 빠진 때
  big: 279만 원
  label: 1996년 · 고점에 산 버팀이의 1,000만 원 · IMF 바닥에서
  photo: {file: crash_screen, dark: 0.6, focus: [0.5, 0.4]}
  tone: down
  'on': 1
  sub: 고점 대비 -72% · 원금까지 3년 8개월
  sub_on: 2
