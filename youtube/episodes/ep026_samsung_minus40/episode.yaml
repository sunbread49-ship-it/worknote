    - {date: '2026-11-25', label: '166,900원', sub: '-54%', 'on': 2, dy: 60, dx: -90, color: down, size: 36}
    source: '자료: 삼성전자 일간 종가 (액면분할 반영 · 11.26 기준)'
    title: 삼성전자 · 2024 ~ 2026
  narration:
  - 2년 전 4만 9천 원이던 주식이, 1년 반 만에 7배가 됐다가,
  - 다섯 달 만에 반이 날아갔어요.
# ── 두 사람 ──
- type: duel
  chapter: 두 사람
  heading: 오늘의 두 사람
  highlight: 두 사람
  left: {title: 버팀이, value: 고점에 샀다, sub: '팔지 않고 끝까지 버팀', color: down, 'on': 1}
  right: {title: 줍줍이, value: '-40%에 샀다', sub: '무서울 때 새로 들어감', color: up, 'on': 2}
  narration:
  - 오늘은 두 사람을 따라가 볼게요. 첫 번째 버팀이. 꼭대기에서 사서, 팔지 않고 버티는 사람이에요. 지금 많은 분들이 여기 계시죠.
  - 두 번째 줍줍이. 고점에서 40% 빠진 날, 무서울 때 새로 들어간 사람이에요.
- type: timeline
