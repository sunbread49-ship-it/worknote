# ── 회사 ──
- type: building
  chapter: 삼성전자는 어떤 회사
  kicker: 쉽게 말하면, 3층짜리 백화점
  title: 삼성전자는 뭘 팔까
  highlight: 뭘 팔까
  sign: 삼성전자
  floors:
  - {floor: 3층, name: TV · 가전, sub: 냉장고 · 에어컨 · TV, icon: tv, 'on': 2, offset: 1.2}
  - {floor: 2층, name: 갤럭시 스마트폰, sub: 세계 판매 1 · 2등, icon: phone, 'on': 2}
  - {floor: 1층, name: 반도체 (메모리), sub: 컴퓨터 · AI의 기억력, tag: 돈의 대부분, icon: chip, hl: true, 'on': 1}
  narration:
  - 그 전에, 삼성전자가 뭘 파는 회사인지 딱 30초만 볼게요. 3층짜리 백화점이라고 생각해 보세요. 1층은 반도체. 컴퓨터와 에이아이가 기억하는 데 쓰는 메모리 칩이에요. 돈의 대부분이 여기서 나와요.
  - 2층은 갤럭시 스마트폰, 3층은 TV와 가전이에요. 그러니까 삼성전자 주가는, 결국 1층 메모리 장사에 달려 있어요.
- type: scale
  chapter: 삼성전자는 어떤 회사
  heading: 지금 삼성전자의 저울
  highlight: 저울
  left: {label: 좋은 점, value: 역대 최대 이익, weight: 1.0, sub: '3분기 영업이익 107조 · HBM4 엔비디아 공급 예정', color: [90, 220, 150], 'on': 1}
  right: {label: 걱정거리, value: 메모리값 꺾임, weight: 1.15, sub: '낸드 값 -20% · 중국 추격 · 파운드리 적자', color: [255, 90, 80], 'on': 2}
  note: 주가는 실적보다 먼저 움직인다
  note_hl: 먼저
  note_on: 3
  narration:
  - 지금 저울에 올려 보면요. 좋은 점은 분명해요. 3분기에 영업이익 107조, 역대 최대예요. 에이아이용 고급 메모리도 엔비디아에 공급할 예정이고요.
  - 걱정거리도 있어요. 메모리값이 꺾이기 시작했고, 중국이 무섭게 쫓아오고, 남의 칩을 만들어 주는 파운드리는 아직 고전 중이에요.
  - 그리고 주가는, 늘 실적보다 먼저 움직여요. 그래서 과거를 보는 거예요.
# ── 금방 돌아온 때 ──
- type: punch
  chapter: 금방 돌아온 때
  big: +85%
  label: 2008년 10월 · 금융위기 · 줍줍이의 1,000만 원 → 1년 뒤
  video: {file: money_count_v, dark: 0.55, blur: 2}
  tone: up
  'on': 1
  sub: '-40% 찍은 그날이 바닥 · 1,000만 원 → 1,848만 원'
  sub_on: 1
  narration:
  - 2008년 금융위기. 줍줍이가 -40% 찍은 날 1,000만 원을 넣었는데, 그날이 바로 바닥이었어요.
  - 1년 뒤 1,848만 원. 85% 수익이었어요.
