    title: 2008년 5월 고점에 산 버팀이의 1,000만 원 (만 원)
  narration:
  - 버팀이는요? 고점에서 산 1,000만 원이 533만 원까지 줄었어요. 반 가까이요.
  - 그래도 1년 3개월 만에 원금을 되찾았어요. 이때는 둘 다 웃었죠.
- type: chain
  chapter: 금방 돌아온 때
  kicker: 2022년 반도체 겨울
  title: 버팀이에겐 4년 9개월
  highlight: 4년 9개월
  gap: 520
  nodes:
  - {label: 2021.1 고점, sub: '91,000원', text: 고점, 'on': 1}
  - {label: 2024.11 바닥, sub: '49,900원 · -45%', text: 바닥, hl: true, 'on': 1, offset: 1.0}
  - {label: '2025.10', sub: 원금 회복, text: 회복, 'on': 2}
  links:
