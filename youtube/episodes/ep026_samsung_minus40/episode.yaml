  - {value: 100000, label: 10만 원, sub: 1996년처럼 더 빠지면, 'on': 2}
  narration:
  - 숫자로 콕 집어 볼게요. 2000년처럼 빠지면 13만 원.
  - 1996년처럼 빠지면 10만 원. 이 두 숫자, 기억해 두세요. 과거가 말해 주는 다음 정거장이에요.
- type: dominoes
  chapter: 결말
  kicker: 볼 숫자는 주가가 아니다
  title: 첫 도미노는 메모리값
  highlight: 메모리값
  items:
  - {label: 메모리값, sub: '지금: 꺾이는 중', hl: true, 'on': 1}
  - {label: 실적, sub: 몇 달 뒤 따라 넘어짐, 'on': 2}
  - {label: 주가, sub: 사실 제일 먼저 흔들림, 'on': 2, offset: 1.0}
  note: 메모리값 하락이 멈출 때가 과거의 바닥 근처
  note_hl: 멈출 때
  note_on: 3
  narration:
  - 그래서 결론은 직설적으로 갈게요. 첫째, 주가 말고 메모리값을 보세요. 삼성전자는 1층 메모리 장사에 달려 있다고 했죠. 첫 번째 도미노가 메모리값이에요.
  - 메모리값이 꺾이면 몇 달 뒤 실적이 따라 넘어지고, 주가는 그걸 미리 알고 먼저 흔들려요.
  - 과거 바닥은, 메모리값 하락이 멈춘다는 뉴스가 나올 때쯤이었어요. 역대 최대 실적 뉴스는, 오히려 조심하라는 신호였던 적이 많았고요.
- type: kinetic
  chapter: 결말
  bg: {kind: video, file: market_crash_v, dark: 0.68, blur: 3}
  items:
  - {text: "국민주식은 돌아온다\n단, 3년짜리 약속", highlight: 3년짜리, 'on': 1, size: 120}
  - {text: "3년 못 기다릴 돈이면\n지금 들어가지 마라", highlight: 들어가지 마라, 'on': 2, size: 110}
  narration:
  - 둘째, 국민주식은 돌아온다? 과거엔 맞았어요. 단, 1년이 아니라 3년짜리 약속이었어요.
  - 셋째, 그래서 3년 동안 꺼내 쓸 일 없는 돈이 아니라면, 지금은 들어가지 마세요. 버팀이도 줍줍이도, 결국 시간을 가진 사람이 이겼어요. | 이런 결말 이야기, 계속 보고 싶으시면 구독해 주세요.
