  narration:
  - 1995년 꼭대기에서 산 버팀이의 1,000만 원은, 1997년 IMF 바닥에서 279만 원이 됐어요. 72%가 사라진 거예요.
  - 원금을 찾기까지 3년 8개월. 그 사이 나라가 부도 위기를 맞았죠.
- type: drop
