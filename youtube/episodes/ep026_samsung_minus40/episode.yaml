  narration:
  - 삼성전자가 고점에서 40% 넘게 빠진 건 과거에도 다섯 번 있었어요.
  - 그때 버팀이와 줍줍이는 어떻게 됐을까요? 한 번은 둘 다 웃었고, 한 번은 둘 다 울었어요.
- type: title
