    ✔ 게임주는 이렇게 사야 한다: 출시 6개월 전에 사서, 출시 2주 전에 판다 (11개 중 8개 플러스, 중간값 +29%) · 대작 출시일은 캘린더에 · 6개월 전 알림

    ✔ 펄어비스는 어떤 회사 · 붉은사막은 얼마나 대단한 게임 (개발 7년 · 개발비 1,500억 원+ 업계 추정 · 83일 만에 600만 장 · 게임대상 8관왕)

    ✔ 다음 대작 캘린더: 도깨비 (2028 하반기 목표) · 나이트 크로우W (2027 2분기) · 오딘Q (2027.1) · 넷마블 2027 신작 13종


