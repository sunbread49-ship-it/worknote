  - 첫째, 나를 알아 가는 재밌는 대화 소재로. 둘째, 사람을 16칸에 가두지 않기.
  - 셋째, 채용이나 연애처럼 중요한 판단의 잣대로는 쓰지 않기. | 실제로 지원서에 엠비티아이를 묻는 회사가 생겨서 논란이 되기도 했죠.
