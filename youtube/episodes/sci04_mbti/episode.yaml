  - 다른 회사가 만든 비슷한 검사라서, 유형 끝에 A나 T가 붙죠. 원래 엠비티아이엔 없는 거예요.
  - 공식 검사는 돈을 내고, 해석해 주는 전문가와 함께 받아요.
