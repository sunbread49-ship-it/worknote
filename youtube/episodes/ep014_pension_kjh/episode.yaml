youtube:
  title: '김장훈도 놀란 국민연금, 그 돈 주식에 넣었다면?'
  description: '"한 달에? 그렇게 많이 줘요?" 가수 김장훈 씨가 국민연금 예상 수령액을 듣고 한 말입니다.

    그럼 평균 직장인이 30년 동안 낸 국민연금 보험료를, 그대로 S&P500과 코스피에 넣었다면 지금 얼마일까요? 실제 데이터로 계산했습니다.


    ✔ 30년 보험료 6,468만 원 → S&P500 2.89억 · 코스피 2.02억

    ✔ 반전: 연금으로 받으면 약 2.68억 (내 몫의 8배)

    ✔ 김장훈 같은 고소득 프리랜서 vs 평범한 직장인, 낸 돈 대비 누가 더 받을까

    ✔ 그런데 월 103만 원 vs 적정 노후생활비 198만 원, 노인 빈곤율 39.7%

    ✔ 30년 동안 월급 4배, S&P500 15.6배 — 일한 돈과 돈이 번 돈

    ✔ 노후 소득 피라미드: 국민연금 + 퇴직연금 + 연금저축 = 월 226만 원


    궁금한 종목, 주제, 매매법을 댓글로 남겨 주세요. 다음 영상에서 숫자로 풀어 드립니다.

    📌 주식 악어새 구독하고 다음 백테스트도 받아보세요.


    ※ 본 영상은 투자 교육 목적의 콘텐츠이며, 특정 종목·상품의 매수·매도 추천이 아닙니다.

    ※ 과거 데이터가 미래 수익을 보장하지 않습니다. 주가는 배당 제외 종가, 세금·수수료는 반영하지 않았습니다. 실제 연금액은 가입 기간 · 소득 · 가입 시기에 따라 다르며, 정확한 금액은 국민연금공단 예상연금 조회로 확인하세요.


    [계산 방법]

    평균 직장인 월급 = 2026년 A값(가입자 평균소득월액) 319만 원을 한국 제조업 임금지수(OECD · FRED LCEAMN01KRQ661S)로 과거로 환산한 근사치

    보험료율(회사 몫 포함) 1996~97년 6% · 1998~2025년 9% · 2026년 9.5%, 1996년 11월 ~ 2026년 10월 360개월, 매달 말 종가로 적립

    S&P500(원화) = S&P500 지수 × 원·달러 환율(FRED DEXKOUS) · 코스피 = 코스피 지수 종가

    예상 연금 = 319만 원 × 소득대체율 43% × 30/40 (지금 제도로 단순 계산) · 받는 기간 = 65세 기대여명 21.7년(2024 생명표)

    피라미드 = 퇴직연금(월급의 8.3%) · 연금저축(월급의 5%)을 같은 기간 S&P500과 코스피에 반씩 적립, 해마다 4%씩 꺼내 쓴다고 가정

    고소득 프리랜서 비교 = 30년 동안 평균 소득의 2배, 지역가입자로 보험료 전액 본인 부담 가정 (실제 연예인 개인의 금액이 아님)

    연금저축 세액공제: 연 600만 원 한도(IRP 합산 900만 원), 총급여 5,500만 원 이하 16.5% · 초과 13.2%


    [자료 출처]

    김장훈 발언: SBS 미운 우리 새끼(2026.11.8) 방송 내용 보도 — 텐아시아 · 세계일보 · 파이낸셜뉴스

    보험료율 · 소득대체율: 보건복지부(2025.12.29 발표) · 국민연금 개혁법

    기금 수익률 · 적립금: 국민연금공단 기금운용본부 2025년 운용 성과(잠정) 보도

    기금 소진 전망: 보건복지부 추계(보험료율 13% · 소득대체율 43%)

    적정 노후생활비: 국민연금연구원 국민노후보장패널 10차 부가조사(2024)

    자산 점유율: 국가데이터처 2025 가계금융복지조사

    노인 빈곤율: OECD 한눈에 보는 연금 2025 (국민연금연구원 분석 보도)

    서울 아파트: KB 부동산 월간 아파트 매매가격지수


