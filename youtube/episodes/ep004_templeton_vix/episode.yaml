youtube:
  title: "공포에 3배로 질렀더니… 평균 +117%, 최악은 -80% | 템플턴 역발상 + VIX TQQQ 백테스트"
  description: |
    "모두가 팔 때 사라." 전설의 역발상 투자자 존 템플턴은 1939년, 돈을 빌려서까지 폭락한 주식을 샀습니다.
    그리고 요즘 커뮤니티엔 "공포지수 40 넘으면 TQQQ 풀매수"라는 말이 돕니다.
    하락장에 세게 들어가는 이 공격적인 매매법, 실제 데이터로 백테스트했습니다.

    ✔ 템플턴의 1939년 투자, 4년 뒤 결과
    ✔ S&P500이 -20%, -30%, -40% 빠졌을 때 샀다면 (1929~)
    ✔ 산 다음에 얼마나 더 빠졌나 (가장 중요한 숫자)
    ✔ VIX 40 넘은 날 3배 레버리지를 샀다면 (1998~, 11번)
    ✔ 평균 뒤에 숨은 -80%, 그리고 템플턴과의 결정적 차이

    궁금한 종목, 주제, 매매법을 댓글로 남겨 주세요. 다음 영상에서 숫자로 풀어 드립니다.
    📌 @개미의계산기 구독하고 다음 백테스트도 받아보세요.

    ※ 본 영상은 투자 교육 목적의 콘텐츠이며, 특정 종목·ETF의 매수·매도 추천이 아닙니다.
    ※ 레버리지 ETF는 원금 대부분을 잃을 수 있는 고위험 상품입니다.
    ※ 과거 데이터가 미래 수익을 보장하지 않습니다. 투자 판단과 책임은 본인에게 있습니다.

    [자료] S&P500 일간 종가(배당 제외, 1927~) · 나스닥100 · CBOE VIX · TQQQ 수정주가
    2010년 2월 이전 3배 수익률은 나스닥100 일간 수익률 x3 - 연 0.95%로 계산한 가상 TQQQ(차입비용 미반영)
    템플턴 1939년 투자는 널리 알려진 일화 기준
