  description: '구글이 5월 고점 대비 34% 빠졌어요. 10월 29일에는 하루 -13%, 회사 역사상 최악의 하루였죠. 지금 사도 될까요? 구글이 왜 빠졌는지, 얼마나 버는 회사인지, 과거 폭락 뒤엔 어떻게 됐는지, 그리고 빅7 중 폭락 후 회복이 가장 빠른 종목은 어디인지 데이터로 따라가 봤습니다.


    ✔ 하루 만에 669조 증발 · 나라 1년 예산의 92%

    ✔ 구글이 빠진 이유 3가지: 검색 광고 둔화 · AI 투자비 2배 · 클라우드 +103%로도 못 막음

    ✔ 구글은 1초에 560만 원 · 시가총액 = 삼성전자 4개

    ✔ 16년간 -20% 폭락 8번, 앞의 7번은 모두 회복 (2008년 -67%는 참고)

    ✔ 고점 대비 -30%에 샀다면: 2020년 vs 2022년

    ✔ 빅7 폭락 후 회복 속도 순위 · 엔비디아는 꼴찌

    ✔ 물컵 7개로 보는 비율 맞추기(리밸런싱) · 실제로 얼마를 옮길까

    ✔ 빅7 성적표 · 도전자 앤트로픽 · 스페이스X


    여러분은 구글, 지금 사시겠어요? 버티시겠어요? 댓글로 남겨 주세요.


    [자료] 알파벳 2026년 3분기 보고서(SEC 10-Q) · 각 사 SEC 공시 · 각 사 일간 종가(2010~2026.11.20) · 구글 2008 · 2013 연차보고서(10-K) · 네이버 증권 · 2026년 정부 예산(727.9조) · 환율 1달러 1,340원(FRED)

    [기사 제목] CNBC · 조선일보 · 블룸버그 · BBC · 테크크런치 · 야후 파이낸스 · 로이터 · 포춘

