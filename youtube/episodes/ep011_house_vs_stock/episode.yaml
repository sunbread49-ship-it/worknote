youtube:
  title: '1억, 서울 아파트 vs 코스피 vs 미국 주식 · 36년 백테스트와 대출의 진실'
  description: '1637년 네덜란드, 튤립 한 송이가 집 한 채 값이던 시절. 그 옆 헤렌흐라흐트 운하의 집값은 350년 동안 어떻게 됐을까요?

    그리고 서울은? 1990년에 1억을 서울 아파트, 코스피, 미국 주식에 넣었다면 지금 얼마일까요?


    ✔ 36년 성적표: 서울 아파트 vs 코스피 vs 미국 주식(원화)

    ✔ 압구정 현대아파트, 상징이 된 단지

    ✔ 덜 흔들리는 집, 크게 흔들리는 주식 (최대 하락폭)

    ✔ 이카로스의 날개: 대출 60%로 집을 샀다면 (2006년 · 2021년 고점)

    ✔ 금리가 두 배가 되면 매달 이자는?

    ✔ 맹자의 항산항심: 20대부터 60대까지, 데이터가 말해 주는 원칙


    궁금한 종목, 주제, 매매법을 댓글로 남겨 주세요. 다음 영상에서 숫자로 풀어 드립니다.

    📌 주식 악어새 구독하고 다음 백테스트도 받아보세요.


    ※ 본 영상은 투자 교육 목적의 콘텐츠이며, 특정 종목 · 부동산 · 금융상품의 매수 · 매도 추천이 아닙니다.

    ※ 과거 데이터가 미래 수익을 보장하지 않습니다. 배당 · 월세 · 세금 · 수수료 · 거래비용은 반영하지 않았습니다. 투자 판단과 책임은 본인에게 있습니다.


    [자료] KB국민은행 월간 KB주택가격동향(아파트 매매가격지수, 1986.1~2026.10) · 코스피 · S&P500 일간 종가(월평균) · 원달러 환율(FRED) · 대출금리 근사 = 3개월 은행간 금리 + 1.5%p(FRED) · 물가 = BIS 명목/실질 주택가격지수 비율(FRED)

    대출 시나리오: 자기자본 1억 + 대출 1.5억(LTV 60%) · 집 산 사람의 이자 ≈ 주식 투자자가 내는 월세로 가정

    압구정 현대 분양가 · 시세는 언론 보도 · 시세 사이트 기준(참고용)

    헤렌흐라흐트 지수: Eichholtz (1997), Real Estate Economics


