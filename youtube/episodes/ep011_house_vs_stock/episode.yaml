- type: kinetic
  chapter: 항산항심
  items:
  - {text: "60대의 항산은\n매달 들어오는 돈", on: 1, size: 120, highlight: 매달 들어오는 돈}
  narration: ['그리고 60대의 항산은, 매달 들어오는 돈이에요. | 배당이든, 월세든, 연금이든요.', '자산이 얼마인지보다, 매달 얼마가 들어오는지가 마음을 지켜 줘요. | 그게 맹자가 말한 항산항심의, 현대판 답 아닐까요?']
