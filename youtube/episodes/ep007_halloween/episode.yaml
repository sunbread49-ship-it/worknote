  description: |
    "5월엔 팔고 떠나라(Sell in May)." 월가에서 가장 오래된 격언 중 하나입니다.
    거꾸로 말하면 11월에 사서 4월까지 들고 있으라는 뜻이죠. 이른바 '핼러윈 매매법'.
    1950년부터 76년 치 S&P500, 그리고 나스닥100으로 정말 통했는지 백테스트했습니다.

    ✔ 1년 12달 성적표, 11월은 몇 등?
    ✔ 겨울 6개월 vs 여름 6개월, 76년 승부
    ✔ 5월에 팔고 쉬었다면? 그냥 들고 있었다면? (반전)
    ✔ 현금 이자가 몇 %면 핼러윈 매매법이 이기나
    ✔ 11월 첫 주부터 빠진 해, 그 겨울은?
    ✔ 최근 10년은 달랐다 · 나스닥은 5월도 강했다
    ✔ 보너스: 추수감사절 앞뒤 이틀, 76번 중 64번 상승

    궁금한 종목, 주제, 매매법을 댓글로 남겨 주세요. 다음 영상에서 숫자로 풀어 드립니다.
    📌 주식 악어새 구독하고 다음 백테스트도 받아보세요.

