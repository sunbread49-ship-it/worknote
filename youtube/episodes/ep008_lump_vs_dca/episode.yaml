youtube:
  title: "목돈 생기면 한 번에? 나눠서? 76년 데이터는 한쪽 손을 들었다"
  description: |
    1,200만 원이 생겼습니다. 오늘 한 번에 넣을까요, 매달 100만 원씩 1년 동안 나눠 넣을까요?
    "나눠 사는 게 안전하다"는 말, S&P500 76년 · 나스닥100 40년 데이터로 910번 직접 비교했습니다.

    ✔ 한 번에 vs 나눠서, 910번 붙여 보면 누가 이기나
    ✔ 사상 최고치일 때 한 번에 넣어도 될까?
    ✔ 2000년 · 2008년, 최악의 타이밍에 넣었다면
    ✔ 나눠 사도 1년 뒤 손실 확률은 거의 같았다 (반전)
    ✔ 질문을 바꾸면 답이 바뀐다: 절반만 먼저 넣기

    궁금한 종목, 주제, 매매법을 댓글로 남겨 주세요. 다음 영상에서 숫자로 풀어 드립니다.
    📌 주식 악어새 구독하고 다음 백테스트도 받아보세요.

    ※ 본 영상은 투자 교육 목적의 콘텐츠이며, 특정 종목·ETF의 매수·매도 추천이 아닙니다.
    ※ 과거 데이터가 미래 수익을 보장하지 않습니다. 세금·수수료·배당은 반영하지 않았습니다. 투자 판단과 책임은 본인에게 있습니다.

    [자료] S&P500 월말 종가(1950~2026.10) · 나스닥100(1986~) · 배당 제외
    한 번에 = 시작 달 말에 1,200만 원 / 나눠서 = 시작 달부터 12개월 동안 매달 100만 원(기다리는 돈 이자 0%)
    비교 시점: 시작 후 12개월(기본) · 60개월 · 120개월
