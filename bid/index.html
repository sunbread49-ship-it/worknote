<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>렌탈 입찰 규격대조</title>
<link rel="icon" href="../icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#f2f5f5; --surface:#ffffff; --sunk:#e9eff0; --ink:#14252a; --muted:#566a6f; --faint:#8a9a9e; --line:#d7e0e1;
  --accent:#0a6a72; --accent-ink:#ffffff; --accent-soft:#dcefee;
  --ok:#16793a; --ok-bg:#e1f2e6; --warn:#985300; --warn-bg:#fcefd4; --fail:#b0261b; --fail-bg:#fbe4e1; --unk:#5b6c70; --unk-bg:#e7edee;
  --sans:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0e1618; --surface:#152023; --sunk:#1b292c; --ink:#e2ebec; --muted:#9aacaf; --faint:#6f8286; --line:#26363a;
    --accent:#4db5bb; --accent-ink:#06282b; --accent-soft:#143a3d;
    --ok:#62c98a; --ok-bg:#15331f; --warn:#f0b257; --warn-bg:#3a2a0f; --fail:#f38a80; --fail-bg:#3e1815; --unk:#a5b3b6; --unk-bg:#223034;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e1618; --surface:#152023; --sunk:#1b292c; --ink:#e2ebec; --muted:#9aacaf; --faint:#6f8286; --line:#26363a;
  --accent:#4db5bb; --accent-ink:#06282b; --accent-soft:#143a3d;
  --ok:#62c98a; --ok-bg:#15331f; --warn:#f0b257; --warn-bg:#3a2a0f; --fail:#f38a80; --fail-bg:#3e1815; --unk:#a5b3b6; --unk-bg:#223034;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.3}
p{margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .in{max-width:1200px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand svg{flex:none}
.brand b{display:block;font-size:16px;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:12px}
nav.tabs{display:flex;gap:2px;background:var(--sunk);padding:3px;border-radius:9px}
nav.tabs button{border:0;background:transparent;padding:6px 14px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:500}
nav.tabs button[aria-current="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .08)}
.specchip{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.specchip .dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.specchip .dot.off{background:var(--faint)}

main{max-width:1200px;margin:0 auto;padding:22px 20px 80px;display:flex;flex-direction:column;gap:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.sec{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.02em;margin-bottom:10px}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.danger{color:var(--fail)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:4px 9px;font-size:12.5px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hint{color:var(--muted);font-size:12.5px}
a.lnk,button.lnk{color:var(--accent);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:2px}

.notice{border-radius:var(--r);padding:11px 14px;display:flex;gap:10px;align-items:flex-start;font-size:13.5px;border:1px solid transparent}
.notice.info{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 25%,transparent)}
.notice.warn{background:var(--warn-bg);color:var(--ink);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.notice.err{background:var(--fail-bg);border-color:color-mix(in srgb,var(--fail) 30%,transparent)}
.notice .grow{flex:1}
.notice button.x{background:none;border:0;cursor:pointer;color:var(--muted);font-size:16px;line-height:1}

/* upload */
.intro{display:grid;grid-template-columns:1.1fr 1fr;gap:28px;align-items:start}
.intro h2{font-size:22px;letter-spacing:-.02em;margin-bottom:6px}
.intro p.lead{color:var(--muted);max-width:52ch}
.flow{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.flow li{display:flex;gap:10px;align-items:baseline;color:var(--muted);font-size:13px}
.flow li b{color:var(--ink);font-weight:600}
.flow .n{font-family:var(--mono);font-size:11px;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:0 5px;flex:none}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:1.5px dashed var(--faint);border-radius:var(--r);padding:28px 16px;text-align:center;cursor:pointer;background:var(--sunk);transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.drop b{font-weight:600}
.drop span{color:var(--muted);font-size:12.5px}
.files{list-style:none;padding:0;margin:12px 0 0;display:flex;flex-direction:column;gap:6px}
.files li{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px}
.files .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.files .st{color:var(--muted);font-size:12px;white-space:nowrap}
.files .st.bad{color:var(--fail);white-space:normal}
.ext{font-family:var(--mono);font-size:10.5px;font-weight:600;padding:1px 5px;border-radius:4px;background:var(--sunk);color:var(--muted);text-transform:uppercase}
details.paste{margin-top:12px}
details.paste summary{cursor:pointer;color:var(--muted);font-size:13px}
textarea{width:100%;min-height:140px;margin-top:8px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);resize:vertical}
.recent{margin-top:4px}
.recent ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column}
.recent li button{width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:9px 2px;cursor:pointer;display:flex;gap:10px;align-items:baseline}
.recent li button:hover .t{color:var(--accent)}
.recent .t{flex:1;font-weight:500}
.recent .d{color:var(--muted);font-size:12px}

/* busy */
.busy{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--accent)}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--accent-soft);border-top-color:var(--accent);animation:spin .9s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
.busy .grow{flex:1}
.busy small{display:block;color:var(--muted);font-size:12px}

/* bid head */
.bidhead{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.bidhead .grow{flex:1;min-width:260px}
.eyebrow{font-size:12.5px;color:var(--muted);margin-bottom:3px}
.eyebrow b{color:var(--fail);font-weight:600}
.bidhead h2{font-size:21px;letter-spacing:-.02em}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:12.5px;color:var(--muted)}
.meta span b{color:var(--ink);font-weight:500}

/* status */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.ok{color:var(--ok)} .warn{color:var(--warn)} .fail{color:var(--fail)} .unknown{color:var(--unk)}
.pill.ok{background:var(--ok-bg)} .pill.warn{background:var(--warn-bg)} .pill.fail{background:var(--fail-bg)} .pill.unknown{background:var(--unk-bg)}
.chip{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:5px;white-space:nowrap}
.chip.ok{background:var(--ok-bg)} .chip.warn{background:var(--warn-bg)} .chip.fail{background:var(--fail-bg)} .chip.unknown{background:var(--unk-bg)}

/* summary */
.sumgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.sumcard{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:6px;padding:13px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);border-left:4px solid var(--unk)}
.sumcard:hover{border-color:var(--faint)}
.sumcard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sumcard.v-ok{border-left-color:var(--ok)} .sumcard.v-warn{border-left-color:var(--warn)} .sumcard.v-fail{border-left-color:var(--fail)}
.sumcard .row{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.sumcard .cat{font-size:12.5px;color:var(--muted)}
.sumcard .qty{font-family:var(--mono);font-size:12px;color:var(--muted)}
.sumcard .mdl{font-family:var(--mono);font-weight:600;font-size:15.5px}
.sumcard .cnt{font-size:12px;color:var(--muted)}
.sumcard .fix{font-size:11px;color:var(--accent);font-weight:600}

/* group result */
.grp{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);scroll-margin-top:80px}
.grp>header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.grp h3{font-size:16px}
.grp h3 span{color:var(--muted);font-weight:500}
.grp .qty{font-family:var(--mono);font-size:13px;background:var(--sunk);padding:1px 8px;border-radius:5px}
.grp .gnote{color:var(--muted);font-size:12.5px;flex-basis:100%}
.tblwrap{overflow-x:auto}
table.cmp{border-collapse:collapse;width:100%;min-width:640px}
table.cmp th,table.cmp td{border-bottom:1px solid var(--line);padding:9px 12px;vertical-align:top;text-align:left}
table.cmp tbody tr:last-child td{border-bottom:0}
table.cmp td.rq,table.cmp th.rq{width:250px;min-width:200px;position:sticky;left:0;background:var(--surface);z-index:1;border-right:1px solid var(--line)}
.rq b{display:block;font-weight:600;font-size:13px}
.prio{display:inline-block;font-family:var(--sans);font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:0 6px;vertical-align:middle}
.rq .rowx{float:right;margin:-3px -6px 0 6px;width:24px;height:24px;border:1px solid transparent;border-radius:6px;background:none;color:var(--faint);font-size:16px;line-height:1;cursor:pointer}
.rq .rowx:hover{color:var(--fail);border-color:var(--fail);background:var(--fail-bg)}
.rq .v{display:block;font-size:13px}
.rq small{display:block;color:var(--faint);font-size:11.5px;margin-top:2px}
.rq small.doubt,.rgroup .doubt{display:block;color:var(--warn);font-weight:600;font-size:11.5px;margin-top:3px}
.rgroup .doubt{padding:0 6px 4px}
th.cand{min-width:200px;font-weight:400;background:var(--sunk)}
th.cand.top{background:var(--accent-soft)}
th.cand .rk{font-size:11.5px;color:var(--muted);font-weight:600}
th.cand.top .rk{color:var(--accent)}
th.cand .mdl{font-family:var(--mono);font-weight:600;font-size:15px;margin-top:1px}
th.cand .nm{color:var(--muted);font-size:12.5px;margin-bottom:6px}
th.cand .sumline{font-size:12.5px;margin-top:6px;color:var(--ink)}
th.cand .pick{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:12.5px;cursor:pointer;color:var(--muted)}
th.cand .pick input{accent-color:var(--accent);margin:0}
th.cand .pick.on{color:var(--accent);font-weight:600}
td.c{font-size:13px}
td.c .have{display:block;margin-top:3px}
td.c .note{display:block;color:var(--muted);font-size:12px;margin-top:2px}
td.c.s-fail{background:color-mix(in srgb,var(--fail-bg) 55%,transparent)}
td.c.s-warn{background:color-mix(in srgb,var(--warn-bg) 55%,transparent)}
.gcomment{padding:12px 18px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.gcomment b{color:var(--ink);font-weight:600}
.nocand{padding:16px 18px;color:var(--muted)}

.twocol{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
ul.plain{margin:0;padding:0;list-style:none;display:flex;flex-direction:column}
ul.plain li{padding:8px 0;border-top:1px solid var(--line);font-size:13px}
ul.plain li:first-child{border-top:0;padding-top:0}
ul.plain li b{font-weight:600;margin-right:6px}

/* req editor */
details.reqs>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px}
details.reqs>summary::-webkit-details-marker{display:none}
details.reqs>summary::before{content:"▸";color:var(--muted);transition:transform .15s}
details.reqs[open]>summary::before{transform:rotate(90deg)}
details.reqs>summary h3{font-size:15px}
.rgroup{margin-top:16px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.rgroup .gh{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 10px;background:var(--sunk)}
.rgroup .gh input{border:1px solid transparent;background:transparent;padding:4px 6px;border-radius:6px;font-weight:600}
.rgroup .gh input:hover,.rgroup .gh input:focus{border-color:var(--line);background:var(--surface)}
.rgroup .gh .w-cat{width:9em}.rgroup .gh .w-lab{width:11em}.rgroup .gh .w-qty{width:4.5em;font-family:var(--mono)}
.rgroup table{width:100%;border-collapse:collapse}
.rgroup td{border-top:1px solid var(--line);padding:3px 6px}
.rgroup td input{width:100%;border:1px solid transparent;background:transparent;padding:5px 6px;border-radius:6px;font-size:13px}
.rgroup td input:hover,.rgroup td input:focus{border-color:var(--line);background:var(--surface)}
.rgroup td.i{width:30%}.rgroup td.r{width:38%}.rgroup td.s input{color:var(--muted);font-size:12px}
.rgroup td.x{width:34px;text-align:center}
.rgroup .foot{padding:6px 10px;border-top:1px solid var(--line)}
.wrapx{overflow-x:auto}

/* history */
table.list{width:100%;border-collapse:collapse;min-width:640px}
table.list th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
table.list td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.list tr.click{cursor:pointer}
table.list tr.click:hover td{background:var(--sunk)}
table.list .t{font-weight:600}
table.list .sub{color:var(--muted);font-size:12px}
.picks{display:flex;flex-wrap:wrap;gap:4px}
.picks span{font-family:var(--mono);font-size:11.5px;background:var(--sunk);padding:1px 6px;border-radius:4px}

/* specs */
.spechead{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.spechead .grow{flex:1;min-width:240px}
.spechead h2{font-size:19px}
.catblock{display:flex;flex-direction:column;gap:10px}
.catblock h3{font-size:14px;display:flex;gap:8px;align-items:baseline}
.catblock h3 span{color:var(--muted);font-weight:500;font-size:12.5px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px}
.mcard .mdl{font-family:var(--mono);font-weight:600;font-size:15px}
.mcard .nm{color:var(--muted);font-size:12.5px;margin-bottom:8px}
.mcard dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:12.5px}
.mcard dt{color:var(--muted);max-width:11em}
.mcard dd{margin:0;word-break:keep-all;overflow-wrap:anywhere}
.mcard dd.gap{color:var(--warn);font-style:normal}
.empty{padding:36px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}

/* catalog */
.gcomment.excl ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.gcomment.excl{background:color-mix(in srgb,var(--warn-bg) 40%,transparent)}
.sumhead{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.sumhead .sec{margin:0}
.sumhead select{margin-left:6px;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.catsum{margin-top:16px;padding:10px 12px;border-radius:8px;background:var(--sunk);font-size:13px}
.catmodel{margin-top:12px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.catmodel.isnew{border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
.cmhead{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:8px 12px;background:var(--sunk);font-size:13px}
.cmhead .mono{font-size:14px}
.cmhead .pick{display:flex;gap:6px;align-items:center;cursor:pointer;font-weight:600;color:var(--warn)}
table.cattbl{width:100%;border-collapse:collapse;min-width:640px;font-size:13px}
table.cattbl th{font-size:11.5px;color:var(--muted);text-align:left;font-weight:600;padding:6px 10px;border-bottom:1px solid var(--line)}
table.cattbl td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.cattbl tr:last-child td{border-bottom:0}
table.cattbl td:first-child{width:28px}
table.cattbl td.cv{white-space:pre-line;max-width:260px}
table.cattbl td small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
table.cattbl tr.st-diff td{background:color-mix(in srgb,var(--warn-bg) 50%,transparent)}
.catapply{position:sticky;bottom:0;background:var(--surface);padding:12px 0 4px;margin-top:12px;border-top:1px solid var(--line)}
/* auth & setup */
html,body{margin:0}
[hidden]{display:none!important}
.who{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.auth{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px}
.auth form{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px 22px;display:flex;flex-direction:column;gap:12px}
.auth h1{font-size:19px;display:flex;gap:10px;align-items:center}
.auth p{color:var(--muted);font-size:13px}
.auth label{font-size:12.5px;color:var(--muted);display:block;margin-bottom:4px}
.field{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.auth .err{color:var(--fail)}
.setup ol{margin:10px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:14px}
.setup pre{margin:8px 0 0;max-height:220px;overflow:auto;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:10px;font-family:var(--mono);font-size:11.5px;line-height:1.5;white-space:pre}
.setup code{font-family:var(--mono);font-size:12.5px;background:var(--sunk);padding:1px 5px;border-radius:4px}

@media (max-width:820px){
  .intro,.twocol{grid-template-columns:1fr}
  .top .in{gap:10px}
  table.cmp td.rq,table.cmp th.rq{width:170px;min-width:150px}
}
@media (max-width:480px){
  main{padding-inline:16px}
  .top .in{padding-inline:16px}
  .brand small{display:none}
  nav.tabs{order:3;width:100%}
  nav.tabs button{flex:1;padding:6px 8px}
}
</style>
</head>
<body>
<header class="top"><div class="in">
  <div class="brand">

<script>
/* 문제 진단: 오래된 브라우저에서도 돌도록 옛 문법으로. 오류·불러오지 못한 도구를 화면 아래에 보여준다 */
(function () {
  var errs = [];
  function show() {
    var box = document.getElementById("diag");
    if (!box) { box = document.createElement("div"); box.id = "diag"; box.style.cssText = "position:fixed;left:12px;right:12px;bottom:12px;z-index:50;background:#fbe4e1;color:#14252a;border:1px solid #b0261b;border-radius:10px;padding:12px 14px;font:13px/1.5 'Malgun Gothic',sans-serif;max-height:40vh;overflow:auto;box-shadow:0 4px 16px rgba(0,0,0,.15)"; document.body.appendChild(box); }
    box.innerHTML = "<b>문제가 생겼어요 — 이 상자를 캡처해서 보내 주세요</b><br>" + errs.map(function (e) { return "· " + String(e).replace(/</g, "&lt;"); }).join("<br>") +
      "<br><small>버전 v18 · " + navigator.userAgent.replace(/</g, "&lt;") + "</small>";
  }
  window.__diag = function (msg) { errs.push(msg); if (document.body) show(); };
  window.addEventListener("error", function (e) {
    if (e.target && e.target !== window && e.target.src) window.__diag("불러오지 못함: " + e.target.src.replace(/^https?:\/\//, "").split("/").slice(0, 3).join("/") + " (회사 방화벽이 막았을 수 있어요)");
    else window.__diag("오류: " + (e.message || e.error) + (e.lineno ? " (" + e.lineno + "줄)" : ""));
  }, true);
  window.addEventListener("unhandledrejection", function (e) { var r = e.reason || {}; window.__diag("오류: " + (r.message || r.code || r)); });
  window.addEventListener("load", function () {
    var need = { "로그인 도구(supabase, cdn.jsdelivr.net)": window.supabase, "엑셀 읽기 도구(xlsx, cdnjs)": window.XLSX, "PDF 도구(pdf.js, cdnjs)": window.pdfjsLib, "한글파일 도구(pako, cdnjs)": window.pako, "엑셀 만들기 도구(exceljs, cdnjs)": window.ExcelJS };
    var miss = []; for (var k in need) if (!need[k]) miss.push(k);
    if (miss.length) window.__diag("불러오지 못한 도구: " + miss.join(", "));
    if (typeof window.S === "undefined" && typeof S === "undefined") window.__diag("사이트 코드가 실행되지 않았어요. 브라우저가 너무 오래됐을 수 있어요(크롬·엣지 최신 버전 권장).");
    if (errs.length) show();
  });
})();
</script>

<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const str = v => (v == null ? "" : String(v)).trim();
const clone = o => JSON.parse(JSON.stringify(o));
const enc = new TextEncoder();
const p2 = n => String(n).padStart(2, "0");
const fmtDate = iso => { if (!iso) return ""; const d = new Date(iso); return isNaN(d) ? "" : `${d.getFullYear()}.${p2(d.getMonth() + 1)}.${p2(d.getDate())}`; };
const fmtTime = iso => { if (!iso) return ""; const d = new Date(iso); return isNaN(d) ? "" : `${fmtDate(iso)} ${p2(d.getHours())}:${p2(d.getMinutes())}`; };
const SUPABASE_URL = "https://kvddqnhabvdegmllswsi.supabase.co";
const SUPABASE_KEY = "sb_publishable_VSd7Ti23XVb05Z67mibzcw_MMYP8das";
const FN_URL = SUPABASE_URL + "/functions/v1/bid-ai";
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

const ST = { ok: "충족", warn: "협의", fail: "미달", unknown: "자료 없음" };
const VD = { ok: "적합", warn: "협의 필요", fail: "부적합", unknown: "확인 필요" };

const S = {
  settings: {}, view: "bid", sb: null, me: null, email: "", canWrite: null, setup: null, aiDown: false,
  spec: null, specLoaded: false, bids: [], bidsLoaded: false,
  cur: null, dirty: false, files: [], pasted: "",
  busy: null, msg: null, specPreview: null, confirmDel: null,
};

/* ---------- render ---------- */
let pending = false;
function typing() {
  const a = document.activeElement;
  return !!(a && a.closest && a.closest("#main") && a.matches("input:not([type=radio]):not([type=file]),textarea"));
}
function render(force) {
  if (!force && typing()) { pending = true; return; }
  pending = false;
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-current", String(b.dataset.view === S.view)));
  const vq = $("#viaQueue"); if (vq) vq.hidden = !S.viaQueue;
  const n = S.spec?.models?.length || 0;
  $("#specchip").innerHTML = S.specLoaded
    ? (n ? `<span class="dot"></span>스펙 DB ${n}개 모델 · ${fmtDate(S.spec.uploadedAt)}` : `<span class="dot off"></span>스펙 DB 비어 있음`)
    : "";
  const m = $("#main");
  m.innerHTML = vNotices() + (S.setup === "table" || S.showSetup ? vSetup() : S.view === "history" ? vHistory() : S.view === "specs" ? vSpecs() : vBid());
}
document.addEventListener("focusout", () => setTimeout(() => { if (pending && !typing()) render(); }, 0));

function say(type, text) { S.msg = { type, text }; render(true); window.scrollTo({ top: 0, behavior: "smooth" }); }

function vNotices() {
  let h = "";
  if (S.setup === "fn") h += `<div class="notice warn"><div class="grow">AI 연결(Supabase 함수 <code>bid-ai</code>)이 아직 설정되지 않았어요. 기록 보기와 스펙 관리는 지금도 쓸 수 있어요.</div><button class="btn sm" data-act="showsetup">설정 방법 보기</button></div>`;
  if (S.msg) h += `<div class="notice ${S.msg.type}"><div class="grow">${esc(S.msg.text)}</div><button class="x" data-act="closemsg" aria-label="닫기">×</button></div>`;
  return h;
}

/* ---------- bid view ---------- */
function vBid() {
  let h = S.busy ? vBusy() : "";
  if (!S.cur || S.reupload) return h + vUpload();
  const c = S.cur;
  h += vBidHead();
  if (c.match) {
    if (c.reqEdited) h += `<div class="notice warn"><div class="grow">조건을 지우거나 고쳤어요. 판정 개수는 바로 반영됐고, <b>다시 대조</b>를 누르면 남은 조건으로 모델 순위를 새로 매겨요.</div><button class="btn primary sm" data-act="match" ${aiOff()}>다시 대조</button></div>`;
    else if (S.spec && c.match.specAt && c.match.specAt !== S.spec.uploadedAt) h += `<div class="notice info"><div class="grow">이 결과를 낸 뒤 제품 스펙 DB가 바뀌었어요. 최신 스펙으로 다시 대조할 수 있어요.</div><button class="btn sm" data-act="match" ${aiOff()}>최신 스펙으로 다시 대조</button></div>`;
    h += vSummary() + c.groups.map(vGroup).join("") + vBottom();
  } else if (!S.busy) {
    h += `<div class="notice info"><div class="grow">${S.spec?.models?.length ? "요구 규격을 확인했으면 우리 제품과 대조해 보세요. 아래에서 항목을 고칠 수도 있어요." : "제품 스펙 DB가 비어 있어요. ‘제품 스펙’ 탭에서 스펙 엑셀을 먼저 올려 주세요."}</div>
      ${S.spec?.models?.length ? `<button class="btn primary sm" data-act="match" ${aiOff()}>우리 제품과 대조</button>` : `<button class="btn sm" data-view="specs">제품 스펙 올리기</button>`}</div>`;
  }
  h += vReqEditor();
  if (!c.match) h += vBottom();
  return h;
}
const aiOff = () => (S.sb && S.me && !S.busy ? "" : "disabled");

let setupText = { sql: "", fn: "", queue: "" };
async function loadSetupText() {
  if (setupText.sql) return;
  try {
    const get = f => fetch(f + "?t=" + Date.now(), { cache: "no-store" }).then(r => r.text());
    const [a, b, q] = await Promise.all([get("setup.sql"), get("bid-ai.ts"), get("setup-queue.sql")]);
    setupText = { sql: a, fn: b, queue: q }; render(true);
  } catch {}
}
function vSetup() {
  loadSetupText();
  const tableOk = S.setup !== "table";
  return `<section class="panel setup"><h2 style="font-size:19px">처음 한 번만 하는 설정</h2>
    <p class="hint" style="margin-top:4px">워크노트와 같은 Supabase 프로젝트에 규격대조용 저장 공간과 AI 연결을 추가해요. Supabase 대시보드(supabase.com)에서 아래 순서대로 하면 돼요.</p>
    <ol>
      <li><b>저장 테이블 만들기</b> ${tableOk ? `<span class="pill ok">완료</span>` : ""}<br><span class="hint">SQL Editor → New query → 아래 내용을 붙여넣고 Run</span>
        <div class="actions" style="margin-top:6px"><button class="btn sm" data-act="copy" data-k="sql">SQL 복사</button></div><pre translate="no">${esc(setupText.sql || "불러오는 중…")}</pre></li>
      <li><b>AI 연결 함수 만들기</b><br><span class="hint">Edge Functions → Deploy a new function → Via Editor → 이름을 <code>bid-ai</code>로 하고 아래 코드를 붙여넣은 뒤 Deploy</span>
        <div class="actions" style="margin-top:6px"><button class="btn sm" data-act="copy" data-k="fn">함수 코드 복사</button></div><pre translate="no">${esc(setupText.fn || "불러오는 중…")}</pre></li>
      <li><b>비밀값 넣기</b><br><span class="hint">Edge Functions → Secrets 에 두 개 추가</span><br>
        <code>GEMINI_API_KEY</code> = aistudio.google.com 에서 만든 무료 API 키 (결제 설정은 하지 마세요)<br>
        <code>ALLOWED_EMAILS</code> = 이 사이트를 쓸 이메일 (지금 로그인한 계정: <b>${esc(S.email)}</b>)</li>
      <li><b>회사 네트워크 우회 (회사에서 AI가 안 될 때)</b><br><span class="hint">SQL Editor → New query → 아래 내용을 붙여넣고 Run. 2번 함수도 v4 이상이어야 해요.</span>
        <div class="actions" style="margin-top:6px"><button class="btn sm" data-act="copy" data-k="queue">우회 SQL 복사</button></div><pre translate="no">${esc(setupText.queue || "불러오는 중…")}</pre></li>
    </ol>
    <div class="actions" style="margin-top:16px"><button class="btn primary" data-act="recheck">설정 끝났어요 · 다시 확인</button>${tableOk ? `<button class="btn" data-act="hidesetup">닫기</button>` : ""}</div>
  </section>`;
}

function vUpload() {
  const f = S.files;
  const readable = f.some(x => x.status === "ok") || S.pasted.trim().length > 30;
  const reading = f.some(x => x.status === "reading");
  const recent = S.bids.slice(0, 4);
  return `<section class="panel"><div class="intro">
    <div>
      ${S.reupload ? `<div class="notice info" style="margin-bottom:14px"><div class="grow"><b>${esc(S.reupload.title)}</b> 문서를 다시 올려요. 처음부터 다시 정리하니까 지운 조건도 다시 나타나요.</div><button class="btn sm" data-act="cancelreupload">취소</button></div>` : ""}
      <h2>${S.reupload ? "문서 다시 올리기" : "새 입찰 대조"}</h2>
      <p class="lead">입찰공고문·과업지시서·규격서·제안요청서 등 그 입찰의 문서를 모두 올리면 요구 규격을 뽑아서 우리 제품 스펙과 항목별로 맞춰 봐요. 문서끼리 내용이 겹쳐도 괜찮아요.</p>
      <ol class="flow">
        <li><span class="n">1</span><span><b>문서 올리기</b> · HWP, PDF 그대로, 여러 개 한 번에</span></li>
        <li><span class="n">2</span><span><b>요구 규격 정리</b> · 제품군·구분별 항목, 근거 쪽수까지</span></li>
        <li><span class="n">3</span><span><b>모델 대조</b> · 후보 순위와 항목별 충족 / 협의 / 미달 / 자료 없음</span></li>
        <li><span class="n">4</span><span><b>제안 확정·엑셀 저장</b> · 기록은 자동 보관</span></li>
      </ol>
      ${recent.length ? `<div class="recent" style="margin-top:22px"><p class="sec">최근 입찰</p><ul>${recent.map(b => `<li><button data-act="open" data-id="${esc(b.id)}"><span class="t">${esc(b.title || "제목 없음")}</span><span class="d">${esc(b.org || "")} · ${fmtTime(b.createdAt)}</span></button></li>`).join("")}</ul></div>` : ""}
    </div>
    <div>
      <label class="drop" id="drop" for="fileIn">
        <input type="file" id="fileIn" multiple accept=".hwp,.hwpx,.pdf,.txt">
        <b>파일을 끌어다 놓거나 눌러서 고르기</b>
        <span>HWP · HWPX · PDF · TXT · 여러 개 한 번에</span>
      </label>
      ${f.length ? `<ul class="files">${f.map(x => `<li><span class="ext">${esc(x.ext)}</span><span class="nm" title="${esc(x.name)}">${esc(x.name)}</span>
        <span class="st ${x.status === "error" ? "bad" : ""}">${x.status === "reading" ? "읽는 중…" : x.status === "error" ? esc(x.error) : x.chars.toLocaleString() + "자"}</span>
        <button class="btn ghost sm" data-act="rmfile" data-id="${x.id}" aria-label="빼기">×</button></li>`).join("")}</ul>` : ""}
      <details class="paste" ${S.pasted ? "open" : ""}><summary>텍스트 직접 붙여넣기 (스캔 PDF 등)</summary>
        <textarea id="pasted" data-f="pasted" placeholder="공고문이나 규격표 내용을 붙여넣어 주세요">${esc(S.pasted)}</textarea></details>
      <div class="actions" style="margin-top:14px">
        <button class="btn primary" data-act="extract" ${readable && !reading && !aiOff() ? "" : "disabled"}>요구 규격 뽑고 대조하기</button>
        <span class="hint">${S.spec?.models?.length ? `스펙 DB ${S.spec.models.length}개 모델과 대조해요` : "스펙 DB가 비어 있으면 규격 정리까지만 해요"}</span>
      </div>
    </div>
  </div></section>`;
}

function vBusy() {
  const b = S.busy;
  return `<div class="busy" role="status"><span class="spin"></span><div class="grow"><b>${esc(b.label)}</b>
    <small><span id="busyTime">${Math.round((Date.now() - b.start) / 1000)}</span>초 지남 · ${esc(b.hint || "")}<span id="busyChars"></span></small></div>
    <button class="btn sm" data-act="stop">멈추기</button></div>`;
}

function vBidHead() {
  const c = S.cur, m = c.meta || {};
  const bits = [["기간", m.period], ["예산", m.budget], ["장소", m.place]].filter(x => x[1]);
  return `<section class="bidhead">
    <div class="grow">
      <p class="eyebrow">${esc(m.org || c.org || "")}${m.deadline ? ` · 서류 마감 <b>${esc(m.deadline)}</b>` : ""}</p>
      <h2>${esc(c.title || "제목 없음")}</h2>
      <div class="meta">${bits.map(([k, v]) => `<span>${k} <b>${esc(v)}</b></span>`).join("")}
        ${(c.files || []).length ? `<span>문서 <b>${c.files.map(f => esc(f.name)).join(", ")}</b></span>` : ""}</div>
    </div>
    <div class="actions">
      ${c.match ? `<button class="btn" data-act="match" ${aiOff()} title="지우거나 고친 조건으로 모델을 다시 골라요">다시 대조</button>` : ""}
      <button class="btn" data-act="reupload" ${S.busy ? "disabled" : ""} title="문서를 새로 올려 처음부터 다시 정리해요">다시 업로드</button>
      ${c.match ? `<button class="btn" data-act="export">엑셀로 받기</button>` : ""}
      <button class="btn" data-act="newbid">새 입찰</button>
    </div>
  </section>`;
}

function grade(cand, g) {
  const n = { ok: 0, warn: 0, fail: 0, unknown: 0 };
  for (const r of g.reqs) n[cand.checks?.[r.id]?.s in n ? cand.checks[r.id].s : "unknown"]++;
  return { v: n.fail ? "fail" : n.warn ? "warn" : n.unknown ? "unknown" : "ok", n };
}
const cntText = n => [n.fail && `미달 ${n.fail}`, n.warn && `협의 ${n.warn}`, n.unknown && `자료 없음 ${n.unknown}`].filter(Boolean).join(" · ") || "모든 항목 충족";
const mg = gid => S.cur.match?.groups?.find(x => x.gid === gid);
const modelInfo = code => S.spec?.models?.find(m => m.model === code);
const gTitle = g => esc(g.category) + (g.label ? ` <span>· ${esc(g.label)}</span>` : "");

// 추천 순서: 미달이 적은 모델이 항상 먼저. 그다음은 고른 방식에 따라 우선순위와 협의 개수를 비교한다
const RANK_MODES = { nofail: "미달만 없으면 우선순위 먼저", gap2: "협의 2개 차이까지는 우선순위 먼저", fit: "적합도 우선 (협의 적은 순)" };
const rankMode = () => RANK_MODES[S.settings?.rankMode] ? S.settings.rankMode : "nofail";
function orderedCands(gid) {
  const g = S.cur?.groups.find(x => x.id === gid), r = mg(gid);
  const cands = (r?.candidates || []).slice();
  if (!g) return cands;
  const mode = rankMode(), pr = m => modelInfo(m)?.priority ?? 99;
  return cands.sort((a, b) => {
    const A = grade(a, g).n, B = grade(b, g).n;
    if (A.fail !== B.fail) return A.fail - B.fail;
    const prio = pr(a.model) - pr(b.model), warn = A.warn - B.warn, rest = A.unknown - B.unknown || (a.rank || 9) - (b.rank || 9);
    if (mode === "nofail" && A.fail === 0) return prio || warn || rest;
    if (mode === "gap2" && Math.abs(warn) <= 2) return prio || warn || rest;
    return warn || prio || rest;
  });
}
async function setRankMode(mode) {
  if (!RANK_MODES[mode]) return;
  S.settings = { ...(S.settings || {}), rankMode: mode };
  render(true);
  try { await putRow("settings", "settings", S.settings); } catch { say("err", "추천 순서 설정을 저장하지 못했어요."); }
}

// 제품군 이름을 큰 묶음으로: 냉온정수기·얼음정수기 → 정수기
const fam = s => { s = str(s); return /정수기/.test(s) ? "정수기" : /청정/.test(s) ? "공기청정기" : /비데/.test(s) ? "비데" : s; };
const priOf = v => { const s = str(v).toUpperCase(); if (!s) return null; if (/^(O|○|V|Y)$/.test(s)) return 1; const n = parseFloat(s); return isFinite(n) && n > 0 ? n : null; };

// 스펙 엑셀 읽기: '모델명' 칸이 있는 표 = 모델별 스펙, '모델명' 없이 '제품군'(적용 제품군) 칸이 있는 표 = 공통사항
function parseSpecWorkbook(wb) {
  const byModel = new Map(), commons = [], sheetMap = new Map(), refs = [];
  const norm = s => str(s).replace(/\s*\n\s*/g, " ").replace(/\s{2,}/g, " ");
  const nk = s => s.replace(/\s/g, "");
  for (const name of wb.SheetNames) {
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, defval: null, raw: true, blankrows: true });
    let head = null, used = false;
    for (const row of rows) {
      const cells = (row || []).map(norm);
      const filled = cells.filter(Boolean).length;
      if (!filled) { head = null; continue; }
      const mi = cells.findIndex(c => nk(c) === "모델명" || /^모델(명|코드)?$/.test(nk(c)));
      if (mi >= 0) {
        head = { type: "model", cols: cells, mi }; used = true;
        if (!sheetMap.has(name)) sheetMap.set(name, { name, cols: [] });
        const sh = sheetMap.get(name); cells.forEach(c => { if (c && !sh.cols.includes(c)) sh.cols.push(c); });
        continue;
      }
      const si = cells.findIndex(c => /^(적용제품군|적용범위|적용|제품군)$/.test(nk(c)));
      if (si >= 0 && filled >= 2 && (!head || head.type !== "model")) {
        const ii = cells.findIndex(c => nk(c) === "항목"), vi = cells.findIndex(c => nk(c) === "내용");
        head = { type: "common", cols: cells, si, ii, vi }; used = true; continue;
      }
      if (!head) continue;
      if (head.type === "common") {
        const scope = cells[head.si] || "전체";
        if (head.ii >= 0 && head.vi >= 0) { if (cells[head.vi]) commons.push({ scope, item: cells[head.ii] || "", value: cells[head.vi] }); }
        else head.cols.forEach((h, j) => { if (h && cells[j] && j !== head.si && !/^(no\.?|번호|순번)$/i.test(nk(h))) commons.push({ scope, item: h, value: cells[j] }); });
        continue;
      }
      const code = cells[head.mi];
      if (!code) continue;
      let m = byModel.get(code);
      if (!m) { m = { model: code, category: "", name: "", priority: null, sheet: name, specs: {} }; byModel.set(code, m); }
      head.cols.forEach((h, j) => {
        const v = cells[j];
        if (!h || !v || j === head.mi) return;
        const hk = nk(h);
        if (/^(no\.?|번호|순번)$/i.test(hk)) return;
        if (/우선순위/.test(hk)) { m.priority = priOf(v); return; }
        if (hk === "제품군" || hk === "분류" || hk === "카테고리") { m.category ||= v; return; }
        if (hk === "제품명" || hk === "상품명") { m.name ||= v; return; }
        let key = h, k = 2;
        while (key in m.specs && m.specs[key] !== v) key = `${h} (${k++})`;
        m.specs[key] = v;
      });
      if (!m.category && !/^(sheet\d*|시트\d*)$/i.test(name)) m.category = name;
    }
    // 모델·공통사항이 없는 참고용 시트는 엑셀로 받을 때 그대로 돌려주려고 보관
    if (!used && !/작성\s*규칙/.test(name)) { const keep = rows.filter(r => (r || []).some(v => v != null && v !== "")).slice(0, 200).map(r => r.map(v => v == null ? null : v)); if (keep.length) refs.push({ name, rows: keep }); }
  }
  return { models: [...byModel.values()], commons, sheets: [...sheetMap.values()], refs };
}

/* ---------- document reading ---------- */
function tidy(t) {
  return t.replace(/\r/g, "").replace(/[ \t 　]+/g, " ")
    .replace(/([^\s\d]{1,12}?)\1{3,}/g, "$1")
    .replace(/((?:[^\s\d]\S* ){1,3}?)\1{3,}/g, "$1")
    .replace(/ *\n */g, "\n").replace(/\n{3,}/g, "\n\n").trim();
}
async function readDoc(file) {
  const ext = (file.name.split(".").pop() || "").toLowerCase();
  const buf = new Uint8Array(await file.arrayBuffer());
  let t;
  if (ext === "pdf") t = await pdfText(buf);
  else if (ext === "hwp") t = hwpText(buf);
  else if (ext === "hwpx") t = hwpxText(buf);
  else if (["txt", "md", "csv"].includes(ext)) t = new TextDecoder().decode(buf);
  else throw new Error("HWP, HWPX, PDF, TXT만 읽을 수 있어요");
  t = tidy(t);
  if (t.replace(/\[\d+쪽\]|\s/g, "").length < 40) throw new Error("글자를 찾지 못했어요. 스캔본이면 텍스트를 붙여넣어 주세요");
  return t;
}
async function pdfText(buf) {
  const lib = window.pdfjsLib;
  if (!lib) throw new Error("PDF 읽기 도구를 불러오지 못했어요");
  lib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  const pdf = await lib.getDocument({ data: buf, isEvalSupported: false }).promise;
  const out = [];
  for (let p = 1; p <= pdf.numPages; p++) {
    const tc = await (await pdf.getPage(p)).getTextContent();
    let s = "";
    for (const it of tc.items) { s += it.str || ""; if (it.hasEOL) s += "\n"; }
    out.push(`[${p}쪽]\n${s}`);
  }
  return out.join("\n");
}
const u8 = c => (c instanceof Uint8Array ? c : Uint8Array.from(c || []));
function hwpText(buf) {
  if (!window.XLSX?.CFB) throw new Error("한글 파일 읽기 도구를 불러오지 못했어요");
  let cfb;
  try { cfb = XLSX.CFB.read(buf, { type: "array" }); } catch { throw new Error("한글(HWP) 파일 구조를 읽지 못했어요"); }
  const fi = cfb.FullPaths.findIndex(p => /\/FileHeader$/.test(p));
  if (fi < 0) throw new Error("한글(HWP) 5.0 형식이 아니에요. PDF로 저장해서 올려 주세요");
  const hb = u8(cfb.FileIndex[fi].content);
  const prop = hb[36] | (hb[37] << 8);
  if (prop & 2) throw new Error("암호가 걸린 한글 파일이에요");
  if (prop & 4) throw new Error("배포용 한글 문서라 읽을 수 없어요. 한글에서 PDF로 저장해 올려 주세요");
  const secs = cfb.FullPaths.map((p, i) => ({ i, m: p.match(/BodyText\/Section(\d+)$/) })).filter(x => x.m).sort((a, b) => a.m[1] - b.m[1]);
  let out = "";
  for (const s of secs) {
    let d = u8(cfb.FileIndex[s.i].content);
    if (prop & 1) d = pako.inflateRaw(d);
    out += hwpRecords(d) + "\n";
  }
  return out;
}
function hwpRecords(d) {
  const dv = new DataView(d.buffer, d.byteOffset, d.byteLength);
  const CHAR = new Set([0, 10, 13, 24, 25, 26, 27, 28, 29, 30, 31]);
  const out = [];
  let i = 0;
  while (i + 4 <= d.length) {
    const h = dv.getUint32(i, true); i += 4;
    const tag = h & 0x3ff; let size = (h >>> 20) & 0xfff;
    if (size === 0xfff) { size = dv.getUint32(i, true); i += 4; }
    if (tag === 67) {
      let s = "";
      for (let j = 0; j + 1 < size;) {
        const c = dv.getUint16(i + j, true);
        if (c < 32) {
          if (CHAR.has(c)) { if (c === 10 || c === 13) s += "\n"; j += 2; }
          else { if (c === 9) s += " "; j += 16; }
        } else { s += String.fromCharCode(c); j += 2; }
      }
      out.push(s);
    }
    i += size;
  }
  return out.join("\n");
}
function hwpxText(buf) {
  let z;
  try { z = XLSX.CFB.read(buf, { type: "array" }); } catch { throw new Error("HWPX 파일을 열지 못했어요"); }
  const secs = z.FullPaths.map((p, i) => ({ i, m: p.match(/Contents\/section(\d+)\.xml$/i) })).filter(x => x.m).sort((a, b) => a.m[1] - b.m[1]);
  if (!secs.length) throw new Error("HWPX 본문을 찾지 못했어요");
  const dec = new TextDecoder();
  const ent = s => s.replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&amp;/g, "&");
  return secs.map(s => dec.decode(u8(z.FileIndex[s.i].content)).split(/<\/hp:p>/).map(p =>
    [...p.matchAll(/<hp:t(?:\s[^>]*)?>([\s\S]*?)<\/hp:t>/g)].map(m => ent(m[1].replace(/<[^>]+>/g, ""))).join("")).filter(Boolean).join("\n")).join("\n");
}

function parseJSON(text) {
  const t = String(text || "").trim();
  try { return JSON.parse(t); } catch {}
  const fence = t.match(/```(?:json)?\s*([\s\S]*?)```/);
  if (fence) { try { return JSON.parse(fence[1]); } catch {} }
  const a = t.indexOf("{"), b = t.lastIndexOf("}");
  if (a >= 0 && b > a) { try { return JSON.parse(t.slice(a, b + 1)); } catch {} }
  throw { code: "invalid_json" };
}

  }
  if (r.status === 404) { S.setup = "fn"; throw { code: "no_function" }; }
  if (!r.ok) throw { code: body.error || "upstream_error" };
  if (S.setup === "fn") S.setup = null;
  return parseJSON(body.text);
}

// 회사 네트워크 우회: 작업을 bid_jobs 표에 쓰면 서버 안에서 AI 함수가 돌고, 결과를 같은 표에서 읽는다
async function callViaQueue(payload, signal) {
  const { data, error } = await S.sb.from("bid_jobs").insert({ request: payload }).select("id").single();
  if (error) {
    const missing = /bid_jobs|PGRST205|42P01/.test(`${error.code} ${error.message}`);
    window.__diag?.((missing ? "회사망 우회 설정(bid_jobs 표)이 아직 없어요" : "우회 작업을 쓰지 못했어요") + ": " + error.message);
    throw { code: missing ? "no_queue" : "network" };
  }
  const id = data.id, t0 = Date.now();
  let started = false;
  try {
    while (Date.now() - t0 < 175000) {
      if (signal?.aborted) throw { code: "cancelled" };
      await new Promise(res => setTimeout(res, 2500));
      const { data: j, error: e2 } = await S.sb.from("bid_jobs").select("status,result,error").eq("id", id).maybeSingle();
      if (e2) continue;
      if (!j) throw { code: "upstream_error" };
      if (j.status === "done") return j.result || {};
      if (j.status === "error") throw { code: j.error || "upstream_error" };
      if (j.status === "running") started = true;
      if (!started && Date.now() - t0 > 45000) { window.__diag?.("우회 작업이 시작되지 않아요: 설정 4번(DB 트리거)과 bid-ai v4 함수를 확인해 주세요"); throw { code: "queue_stuck" }; }
    }
    throw { code: "timeout" };
  } finally {
    S.sb.from("bid_jobs").delete().eq("id", id).then(() => {}, () => {});
  }
}

let tick = null;
async function runAI(label, hint, work) {
  const ctl = new AbortController();
  S.busy = { label, hint, start: Date.now(), ctl }; S.msg = null; render(true);
  tick = setInterval(() => { const e = $("#busyTime"); if (e) e.textContent = Math.round((Date.now() - S.busy.start) / 1000); }, 1000);
  try {
    return await work(ctl.signal, t => { const e = $("#busyChars"); if (e) e.textContent = t; });
  } catch (e) {
    if (e?.code === "no_function" || e?.code === "no_queue") { S.showSetup = true; if (e.code === "no_queue") say("warn", aiErr(e)); }
    else if (e?.code !== "cancelled") say("err", aiErr(e));
    return null;
  } finally {
    clearInterval(tick); S.busy = null; render(true);
  }
}

function fitDocs(docs, max = 300000) {
  const total = docs.reduce((a, d) => a + enc.encode(d.text).length, 0);
  if (total <= max) return { docs, cut: 0 };
  const ratio = max / total;
  return { docs: docs.map(d => ({ name: d.name, text: d.text.slice(0, Math.floor(d.text.length * ratio)) })), cut: 1 - ratio };
}

async function doExtract() {
  const docs = S.files.filter(f => f.status === "ok").map(f => ({ name: f.name, text: f.text }));
  if (S.pasted.trim()) docs.push({ name: "직접 입력", text: tidy(S.pasted) });
  if (!docs.length) return;
  const { docs: fit, cut } = fitDocs(docs);
  const prompt = EXTRACT_PROMPT + fit.map(d => `\n\n===== 파일: ${d.name} =====\n${d.text}`).join("");
  const o = await runAI("문서에서 요구 규격을 뽑는 중", "보통 1~2분 걸려요", signal => callAI(prompt, "medium", signal));
  if (!o) return;
  if (!Array.isArray(o.groups) || !o.groups.length) { say("err", "요구 규격을 찾지 못했어요. 규격표가 들어 있는 문서인지 확인해 주세요."); return; }
  const meta = o.meta || {};
  const bid = {
    id: uid("b"), title: str(meta.title) || docs[0].name.replace(/\.[^.]+$/, ""), org: str(meta.org),
    meta: { org: str(meta.org), deadline: str(meta.deadline), period: str(meta.period), budget: str(meta.budget), place: str(meta.place) },
    files: docs.map(d => ({ name: d.name, chars: d.text.length })),
    groups: o.groups.map((g, gi) => ({
      id: "g" + (gi + 1), category: str(g.category), label: str(g.label), qty: str(g.qty), note: str(g.note),
      reqs: (Array.isArray(g.reqs) ? g.reqs : []).map((r, ri) => ({ id: "r" + (ri + 1), item: str(r.item), req: str(r.req), src: str(r.src), doubt: str(r.doubt) })),
    })),
    checklist: (Array.isArray(o.checklist) ? o.checklist : []).map(c => ({ item: str(c.item), detail: str(c.detail) })),
    match: null, picks: {}, createdAt: new Date().toISOString(),
  };
  if (S.reupload) { bid.id = S.reupload.id; bid.createdAt = S.reupload.createdAt; bid.reuploadedAt = new Date().toISOString(); S.reupload = null; }
  S.cur = bid; S.dirty = false; S.files = []; S.pasted = "";
  await saveCur();
  if (cut > 0.02) say("warn", `문서가 길어서 뒷부분 약 ${Math.round(cut * 100)}%는 읽지 못했어요. 빠진 규격이 있으면 아래에서 추가해 주세요.`);
  if (S.spec?.models?.length) await doMatch();
  else render(true);
}

// 구분(그룹)마다 따로, 동시에 대조한다 — 한 번의 요청이 너무 길어지지 않게.
async function doMatch() {
  let c = S.cur;
  if (!c || !S.spec?.models?.length || !c.groups.length) return;
  if (S.dirty) await saveCur();
  // 구분마다 그 제품군 모델과 공통사항만 보낸다(빠르고 헷갈림이 적다)
  const modelsFor = g => { const f = fam(g.category); const ms = S.spec.models.filter(m => fam(m.category) === f); return (ms.length ? ms : S.spec.models).map(m => ({ model: m.model, category: m.category, name: m.name, ...(m.priority ? { priority: m.priority } : {}), specs: m.specs })); };
  const commonsFor = g => (S.spec.commons || []).filter(x => /^(전체|공통)/.test(x.scope) || fam(x.scope) === fam(g.category)).map(x => ({ scope: x.scope, item: x.item, value: x.value }));
  const results = await runAI("우리 제품과 대조하는 중", `구분 ${c.groups.length}개를 동시에 대조해요 · 보통 1~2분`, async (signal, progress) => {
    let done = 0;
    progress(` · 0/${c.groups.length} 완료`);
    // 무료 등급의 분당 한도를 넘지 않게 동시에 3개까지만 보낸다
    const settled = new Array(c.groups.length);
    let next = 0;
    const worker = async () => {
      while (next < c.groups.length && !signal.aborted) {
        const i = next++, g = c.groups[i];
        const req = [{ gid: g.id, category: g.category, label: g.label, qty: g.qty, note: g.note, reqs: g.reqs.map(r => ({ rid: r.id, item: r.item, req: r.req, ...(r.doubt ? { doubt: r.doubt } : {}) })) }];
        const cm = commonsFor(g);
        const prompt = MATCH_PROMPT + "\n[요구 규격]\n" + JSON.stringify(req) + "\n\n[우리 제품 스펙]\n" + JSON.stringify(modelsFor(g)) + (cm.length ? "\n\n[공통 사항]\n" + JSON.stringify(cm) : "");
        try { settled[i] = { status: "fulfilled", value: await callAI(prompt, "medium", signal) }; }
        catch (reason) {
          // 생각을 길게 하다 답이 잘리거나 형식이 깨지면, 생각 단계를 줄여 한 번 더
          if (signal.aborted || ["cancelled", "not_signed_in", "not_allowed", "no_api_key", "bad_api_key"].includes(reason?.code)) settled[i] = { status: "rejected", reason };
          else {
            try { settled[i] = { status: "fulfilled", value: await callAI(prompt, "low", signal) }; }
            catch (reason2) { settled[i] = { status: "rejected", reason: reason2 }; }
          }
        }
        progress(` · ${++done}/${c.groups.length} 완료`);
      }
    };
    await Promise.all([worker(), worker(), worker()]);
    for (let i = 0; i < settled.length; i++) settled[i] ||= { status: "rejected", reason: { code: "cancelled" } };
    if (signal.aborted) throw { code: "cancelled" };
    const ok = settled.filter(s => s.status === "fulfilled");
    if (!ok.length) throw settled[0].reason;
    return settled;
  });
  if (!results) return;
  if (!S.cur || S.cur.id !== c.id) return;
  c = S.cur;
  const prev = c.match?.groups || [];
  const groups = [], missing = new Set(), failed = [];
  results.forEach((s, i) => {
    const gid = c.groups[i].id;
    if (s.status !== "fulfilled") { failed.push({ ...c.groups[i], why: aiErr(s.reason) }); const old = prev.find(x => x.gid === gid); if (old) groups.push(old); return; }
    const o = s.value || {};
    const g = (Array.isArray(o.groups) ? o.groups : []).find(x => str(x.gid) === gid) || (o.groups || [])[0] || {};
    (Array.isArray(o.missing) ? o.missing : []).map(str).filter(Boolean).forEach(x => missing.add(x));
    groups.push({
      gid, comment: str(g.comment),
      excluded: (Array.isArray(g.excluded) ? g.excluded : []).map(x => ({ model: str(x.model), reason: str(x.reason) })).filter(x => x.model && !(g.candidates || []).some(cd => str(cd.model) === x.model)).slice(0, 6),
      candidates: (Array.isArray(g.candidates) ? g.candidates : []).slice(0, 3).map((x, j) => {
        const checks = {};
        (Array.isArray(x.checks) ? x.checks : []).forEach(k => { const st = str(k.s); checks[str(k.rid)] = { s: st in ST ? st : "unknown", have: str(k.have), note: str(k.note) }; });
        return { model: str(x.model), rank: Number(x.rank) || j + 1, summary: str(x.summary), checks };
      }),
    });
    // 미달·협의 수가 같으면 엑셀의 규격대조 우선순위 모델을 앞으로
    const grp = c.groups[i], last = groups[groups.length - 1], pr = m => modelInfo(m)?.priority ?? 99;
    last.candidates.sort((a, b) => { const A = grade(a, grp).n, B = grade(b, grp).n; return A.fail - B.fail || A.warn - B.warn || pr(a.model) - pr(b.model) || A.unknown - B.unknown || a.rank - b.rank; });
    last.candidates.forEach((x, k) => { x.rank = k + 1; });
  });
  c.match = { at: new Date().toISOString(), specAt: S.spec.uploadedAt || "", specFile: S.spec.fileName || "", groups, missing: [...missing].slice(0, 25), failed: failed.map(g => g.id), failedWhy: Object.fromEntries(failed.map(g => [g.id, g.why])) };
  for (const g of c.groups) { const p = c.picks?.[g.id]; if (p && !mg(g.id)?.candidates.some(x => x.model === p)) delete c.picks[g.id]; }
  c.reqEdited = false;
  await saveCur();
  if (failed.length) say("warn", `${failed.map(g => g.category + (g.label ? " " + g.label : "")).join(", ")} 대조가 실패했어요(${failed.map(g => g.why).filter((v, i, a) => a.indexOf(v) === i).join(" / ")}). 아래 해당 구분의 안내를 확인해 주세요.`);
  render(true);
}

/* ---------- persistence (Supabase: bid_items) ---------- */
let wq = Promise.resolve();
async function putRow(id, kind, data) {
  const { error } = await S.sb.from("bid_items").upsert({ id, kind, data, updated_at: new Date().toISOString(), user_id: S.me }, { onConflict: "user_id,id" });
  if (error) throw error;
}
function saveCur() {
  if (!S.sb || !S.cur) return Promise.resolve();
  const data = clone(S.cur); const id = data.id; delete data.id;
  data.updatedAt = new Date().toISOString();
  wq = wq.then(() => putRow(id, "bid", data)).then(() => {
    S.dirty = false;
    const i = S.bids.findIndex(b => b.id === id); const row = { id, ...data };
    if (i >= 0) S.bids[i] = row; else S.bids.unshift(row);
    S.bids.sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));
  }).catch(() => say("err", "저장하지 못했어요. 인터넷 연결을 확인하고 다시 시도해 주세요."));
  return wq;
}
async function loadAll() {
  const all = []; let from = 0;
  while (true) {
    const { data, error } = await S.sb.from("bid_items").select("id,kind,data,updated_at").range(from, from + 999);
    if (error) throw error;
    all.push(...data); if (data.length < 1000) break; from += 1000;
  }
  S.spec = all.find(r => r.id === "spec-current")?.data || null;
  S.settings = all.find(r => r.id === "settings")?.data || {};
  S.bids = all.filter(r => r.kind === "bid").map(r => ({ id: r.id, ...r.data })).sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));
  S.specLoaded = S.bidsLoaded = true;
}

/* ---------- export ---------- */
function doExport() {
  const c = S.cur; if (!c?.match) return;
  const wb = XLSX.utils.book_new();
  const sum = [["제품군", "구분", "수량", "제안 모델", "제품명", "판정", "미달", "협의", "자료 없음", "요약", "검토 의견"]];
  const det = [["제품군", "구분", "요구 항목", "요구값", "근거", "오기 의심"]];
  for (let i = 1; i <= 3; i++) det[0].push(`${i}순위 모델`, `${i}순위 판정`, `${i}순위 우리 스펙`, `${i}순위 메모`);
  for (const g of c.groups) {
    const r = mg(g.id); const cands = orderedCands(g.id);
    const cand = cands.find(x => x.model === c.picks?.[g.id]) || cands[0];
    if (cand) { const gr = grade(cand, g); sum.push([g.category, g.label, g.qty, cand.model + (c.picks?.[g.id] ? " (확정)" : ""), modelInfo(cand.model)?.name || "", VD[gr.v], gr.n.fail, gr.n.warn, gr.n.unknown, cand.summary, r?.comment || ""]); }
    else sum.push([g.category, g.label, g.qty, "후보 없음", "", "", "", "", "", "", r?.comment || ""]);
    for (const q of g.reqs) {
      const row = [g.category, g.label, q.item, q.req, q.src, q.doubt || ""];
      cands.forEach(x => { const k = x.checks[q.id]; row.push(x.model, k ? ST[k.s] : "", k?.have || "", k?.note || ""); });
      det.push(row);
    }
  }
  const s1 = XLSX.utils.aoa_to_sheet([[c.title], [`${c.meta?.org || ""}  서류 마감: ${c.meta?.deadline || ""}`], [], ...sum]);
  s1["!cols"] = [10, 12, 6, 16, 18, 10, 6, 6, 8, 40, 50].map(w => ({ wch: w }));
  const s2 = XLSX.utils.aoa_to_sheet(det);
  s2["!cols"] = [10, 12, 18, 22, 18, 24, ...Array(3).fill([14, 9, 20, 30]).flat()].map(w => ({ wch: w }));
  XLSX.utils.book_append_sheet(wb, s1, "제안 요약");
  XLSX.utils.book_append_sheet(wb, s2, "항목별 대조");
  if (c.checklist?.length) XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([["항목", "내용"], ...c.checklist.map(x => [x.item, x.detail])]), "입찰 체크포인트");
  if (c.match.missing?.length) XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([["스펙 DB에 채울 정보"], ...c.match.missing.map(x => [x])]), "스펙 보강");
  XLSX.writeFile(wb, `규격대조_${(c.title || "입찰").replace(/[\\/:*?"<>|]/g, "").slice(0, 60)}.xlsx`);
}

async function addFiles(list) {
  for (const file of list) {
    const x = { id: uid("f"), name: file.name, ext: (file.name.split(".").pop() || "").toLowerCase(), status: "reading", text: "", chars: 0, error: "" };
    S.files.push(x); render();
    try { x.text = await readDoc(file); x.chars = x.text.length; x.status = "ok"; }
    catch (e) { x.status = "error"; x.error = e?.message || "읽지 못했어요"; }
    render();
  }
}
async function loadSpecFile(file) {

async function saveSpec() {

const findG = id => S.cur?.groups.find(g => g.id === id);

document.addEventListener("click", async ev => {
  const v = ev.target.closest("[data-view]");
  if (v && !S.busy) { S.view = v.dataset.view; S.msg = null; S.showSetup = false; render(true); window.scrollTo(0, 0); return; }
  const a = ev.target.closest("[data-act]"); if (!a) return;
  const act = a.dataset.act;
  if (act === "pick" || act === "catitem" || act === "catmodel") return;
  if (act === "closemsg") { S.msg = null; render(true); }
  else if (act === "stop") S.busy?.ctl.abort();
  else if (act === "rmfile") { S.files = S.files.filter(f => f.id !== a.dataset.id); render(true); }
  else if (act === "extract") doExtract();
  else if (act === "match") doMatch();
  else if (act === "export") doExport();
  else if (act === "newbid") { if (S.dirty) await saveCur(); S.cur = null; S.reupload = null; S.msg = null; render(true); window.scrollTo(0, 0); }
  else if (act === "open") { const b = S.bids.find(x => x.id === a.dataset.id); if (b) { S.cur = clone(b); S.dirty = false; S.view = "bid"; S.msg = null; render(true); window.scrollTo(0, 0); } }
  else if (act === "jump") { const el = document.getElementById("grp-" + a.dataset.g); el?.scrollIntoView({ behavior: "smooth", block: "start" }); }
  else if (act === "askdel") { S.confirmDel = a.dataset.id; render(true); }
  else if (act === "nodel") { S.confirmDel = null; render(true); }
  else if (act === "del") {
    const id = a.dataset.id; S.confirmDel = null;
    const { error } = await S.sb.from("bid_items").delete().eq("id", id);
    if (error) say("err", "삭제하지 못했어요.");
    else { S.bids = S.bids.filter(b => b.id !== id); if (S.cur?.id === id) S.cur = null; render(true); }
  }
  else if (act === "savespec") saveSpec();
  else if (act === "cancelspec") { S.specPreview = null; render(true); }
  else if (act === "exportspec") exportSpec();
  else if (act === "catread") readCatalogs();
  else if (act === "catclear") { S.cat = { files: [], props: null }; render(true); }
  else if (act === "catrm") { S.cat.files = S.cat.files.filter(f => f.id !== a.dataset.id); S.cat.props = null; render(true); }
  else if (act === "catapply") applyCatalog();
  else if (act === "catcancel") { S.cat.props = null; render(true); }
  else if (act === "savereqs") { await saveCur(); render(true); }
  else if (act === "addreq") { const g = findG(a.dataset.g); g.reqs.push({ id: uid("r"), item: "", req: "", src: "직접 추가" }); edited(); render(true); keepOpen(); }
  else if (act === "rmreq") {
    const g = findG(a.dataset.g); const fromEditor = !!a.closest("#reqEditor"); const y = window.scrollY;
    g.reqs = g.reqs.filter(r => r.id !== a.dataset.r); edited(); render(true);
    if (fromEditor) keepOpen(); else window.scrollTo(0, y);
    saveCur();
  }
  else if (act === "reupload") { if (S.dirty) await saveCur(); S.reupload = { id: S.cur.id, createdAt: S.cur.createdAt, title: S.cur.title }; S.files = []; S.pasted = ""; S.msg = null; render(true); window.scrollTo(0, 0); }
  else if (act === "cancelreupload") { S.reupload = null; render(true); }
  else if (act === "addgroup") { S.cur.groups.push({ id: uid("g"), category: "", label: "", qty: "", note: "", reqs: [{ id: uid("r"), item: "", req: "", src: "직접 추가" }] }); edited(); render(true); keepOpen(); }
  else if (act === "rmgroup") { S.cur.groups = S.cur.groups.filter(g => g.id !== a.dataset.g); edited(); render(true); keepOpen(); }
  else if (act === "showsetup") { S.showSetup = true; render(true); window.scrollTo(0, 0); }
  else if (act === "hidesetup") { S.showSetup = false; render(true); }
  else if (act === "recheck") { S.showSetup = false; await start(); }
  else if (act === "copy") {
    const t = setupText[a.dataset.k] || "";
    try { await navigator.clipboard.writeText(t); a.textContent = "복사했어요"; }
    catch { const pre = a.closest("li")?.querySelector("pre"); if (pre) { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } a.textContent = "선택됨 · Ctrl+C"; }

/* ---------- 카탈로그로 스펙 채우기 · 스펙 엑셀 받기 ---------- */
const KEY_COL = h => {
  const k = str(h).replace(/\s/g, "");
  if (/^(no\.?|번호|순번)$/i.test(k)) return "no";
  if (/우선순위/.test(k)) return "priority";
  if (/^(제품군|분류|카테고리)$/.test(k)) return "category";
  if (/^(제품명|상품명)$/.test(k)) return "name";
  if (k === "모델명" || /^모델(명|코드)?$/.test(k)) return "model";
  return null;
};
const codeKey = s => str(s).toUpperCase().replace(/[^A-Z0-9]/g, "");
const findModel = code => { const k = codeKey(code); return k ? S.spec?.models?.find(m => codeKey(m.model) === k) : null; };
const normVal = s => str(s).toLowerCase().replace(/[\s,]/g, "").replace(/(mm|kg|l|w|㎡|평형|개월|%|db|ppm)$/i, "");
const sameVal = (a, b) => { const x = normVal(a), y = normVal(b); if (x === y) return true; const p = parseFloat(x), q = parseFloat(y); return /^[\d.]+$/.test(x) && /^[\d.]+$/.test(y) && p === q; };

// 시트 구성: 엑셀을 올릴 때 기록한 시트·머리글, 없으면 제품군별로 만든다
function sheetsOf(spec) {
  if (spec?.sheets?.length) return spec.sheets;
  const map = new Map();
  for (const m of spec?.models || []) {
    const n = fam(m.category) || "기타";
    if (!map.has(n)) map.set(n, { name: n, cols: ["no.", "규격대조 우선순위", "제품군", "제품명", "모델명"] });
    const s = map.get(n);
    for (const k of Object.keys(m.specs || {})) if (!s.cols.includes(k)) s.cols.push(k);
  }
  return [...map.values()];
}
const sheetOfModel = (spec, m) => {
  const all = sheetsOf(spec);
  return (m.sheet && all.some(s => s.name === m.sheet) ? m.sheet : null) || all.find(s => fam(s.name) === fam(m.category))?.name || all[0]?.name || "기타";
};

S.cat = { files: [], props: null };

async function pdfPagesAsImages(file, maxPages = 40) {
  const lib = window.pdfjsLib;
  if (!lib) throw new Error("PDF 읽기 도구를 불러오지 못했어요");
  const base = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
  lib.GlobalWorkerOptions.workerSrc = base + "pdf.worker.min.js";
  const pdf = await lib.getDocument({ data: new Uint8Array(await file.arrayBuffer()), isEvalSupported: false, cMapUrl: base + "cmaps/", cMapPacked: true, standardFontDataUrl: base + "standard_fonts/" }).promise;
  const pages = [];
  for (let p = 1; p <= Math.min(pdf.numPages, maxPages); p++) {
    const page = await pdf.getPage(p);
    const w = page.getViewport({ scale: 1 }).width;
    const vp = page.getViewport({ scale: Math.min(3, 1600 / w) });
    const cv = document.createElement("canvas");
    cv.width = Math.round(vp.width); cv.height = Math.round(vp.height);
    const ctx = cv.getContext("2d");
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cv.width, cv.height);
    await page.render({ canvasContext: ctx, viewport: vp }).promise;
    pages.push({ page: p, mime: "image/jpeg", data: cv.toDataURL("image/jpeg", 0.82).split(",")[1] });
    cv.width = cv.height = 0;
  }
  return { pages, total: pdf.numPages };
}
const fileB64 = file => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(",")[1]); r.onerror = () => no(r.error); r.readAsDataURL(file); });

async function addCatalogs(list) {
  for (const file of list) {
    const x = { id: uid("c"), name: file.name, status: "reading", pages: [], total: 0, error: "", results: [], errors: [] };
    S.cat.files.push(x); S.cat.props = null; render();
    try {
      if (/\.pdf$/i.test(file.name)) { const r = await pdfPagesAsImages(file); x.pages = r.pages; x.total = r.total; }
      else if (/^image\/(jpeg|png|webp)$/.test(file.type)) { x.pages = [{ page: 1, mime: file.type, data: await fileB64(file) }]; x.total = 1; }
      else throw new Error("PDF나 이미지(JPG·PNG) 파일만 읽을 수 있어요");
      x.status = "ready";
    } catch (e) { x.status = "error"; x.error = e?.message || "파일을 열지 못했어요"; }
    render();
  }
}

const CATALOG_PROMPT = `너는 렌탈가전(정수기·공기청정기·비데) 제품 스펙을 엑셀로 정리하는 담당자다.
첨부 이미지는 카탈로그 "{FILE}"의 {PAGES}쪽이다(이미지 순서대로). 이미지에 나온 제품의 스펙을 읽어서 우리 스펙 엑셀의 칸에 맞춰 값을 뽑아라.

[우리 스펙 엑셀 시트와 칸]
{SHEETS}

[엑셀에 이미 있는 모델]
{MODELS}

규칙
1. 카탈로그 제품을 [엑셀에 이미 있는 모델]과 모델명으로 맞춘다. 표기가 조금 달라도(공백·하이픈, "C(H)P-5700R" → "CHP-5700R") 같은 모델이면 엑셀 모델명을 그대로 쓴다. 엑셀에 없으면 is_new를 true로 하고 sheet(넣을 시트 이름), name(제품명), category(제품군: 냉온정수기/얼음정수기/공기청정기/비데 등)를 적는다.
2. values의 col은 그 시트의 칸 이름을 글자 그대로 쓴다. value는 칸 이름의 단위에 맞춘 값만 쓴다(예: "가로(mm)" 칸에 "320"). "(O/X)" 칸은 O 또는 X. 그 밖의 칸은 카탈로그 표현을 짧게.
3. 크기 "320 X 490 X 1 260 mm"는 가로 320, 세로 490, 높이 1260으로 나눈다. 관리주기 "1회/2개월 또는 1회/4개월"은 방문 점검주기(개월) 칸에 "2 또는 4". 용량은 냉수·온수·정수·얼음을 각 칸에 나눈다.
4. 이미지에 분명히 적힌 것만 쓴다. 추측하지 않는다. 값마다 page(쪽 번호)와 quote(근거가 된 카탈로그 원문, 30자 이내)를 쓴다.
5. "특징·장점" 칸이 있으면 카탈로그의 핵심 기능·장점을 5줄 이내로, 줄 사이는 \\n으로 구분한다.
6. 엑셀 칸에는 없지만 입찰 규격 대조에 쓸 만한 정보(예: 제품중량(kg), 소비전력, 주요기능, 일일 제빙량(kg), 인증번호)는 new_cols에 넣는다. col에 단위를 포함한다. 최대 8개.
7. 렌탈 약관·면책 문구·시험 방법 설명은 무시한다.

JSON 하나만 답한다. 형식:
{"models":[{"model":"","is_new":false,"sheet":"","name":"","category":"","values":[{"col":"","value":"","page":1,"quote":""}],"new_cols":[{"col":"","value":"","page":1,"quote":""}]}]}`;

async function readCatalogs() {
  if (!S.spec?.models?.length) return say("warn", "먼저 스펙 엑셀을 올려 주세요. 카탈로그 값을 그 칸에 맞춰 채워요.");
  const files = S.cat.files.filter(f => f.pages.length && f.status !== "reading");
  if (!files.length) return;
  const spec = S.spec;
  const sheets = sheetsOf(spec).map(s => `- ${s.name}: ${s.cols.filter(c => !KEY_COL(c)).join(" | ")}`).join("\n");
  const models = spec.models.map(m => `${m.model} (${m.name || ""}, 시트: ${sheetOfModel(spec, m)})`).join("\n");
  const jobs = [];
  for (const f of files) {
    f.results = []; f.errors = []; f.status = "ready";
    for (let i = 0; i < f.pages.length; i += 4) jobs.push({ f, pages: f.pages.slice(i, i + 4) });
  }
  const ok = await runAI("카탈로그를 읽는 중", `${files.length}개 파일 · 파일당 30초~1분`, async (signal, progress) => {
    let next = 0, done = 0;
    progress(` · 0/${jobs.length}`);
    const worker = async () => {
      while (next < jobs.length && !signal.aborted) {
        const j = jobs[next++];
        const prompt = CATALOG_PROMPT.replace("{FILE}", j.f.name).replace("{PAGES}", j.pages.map(p => p.page).join(", ")).replace("{SHEETS}", sheets).replace("{MODELS}", models);
        try {
          const o = await callAI(prompt, "medium", signal, { images: j.pages.map(p => ({ mime: p.mime, data: p.data })) });
          (Array.isArray(o?.models) ? o.models : []).forEach(r => j.f.results.push(r));
        } catch (e) {
          if (signal.aborted || e?.code === "cancelled") throw e;
          j.f.errors.push(aiErr(e));
        }
        progress(` · ${++done}/${jobs.length}`);
      }
    };
    await Promise.all([worker(), worker()]);
    if (signal.aborted) throw { code: "cancelled" };
    return true;
  });
  for (const f of files) f.status = f.errors.length && !f.results.length ? "failed" : "done";
  if (ok) S.cat.props = buildCatalogProposals(files);
  render(true);
}

function buildCatalogProposals(files) {
  const spec = S.spec, byCode = new Map();
  for (const f of files) {
    const nModels = new Set(f.results.map(r => codeKey(r.model))).size || 1;
    for (const r of f.results) {
      const ex = findModel(r.model), code = ex ? ex.model : str(r.model);
      if (!code) continue;
      let e = byCode.get(code);
      if (!e) {
        const sh = sheetsOf(spec);
        const sheet = ex ? sheetOfModel(spec, ex) : (sh.find(s => s.name === str(r.sheet))?.name || sh.find(s => fam(s.name) === fam(r.category))?.name || str(r.sheet) || fam(r.category) || "기타");
        e = { model: code, isNew: !ex, sheet, name: ex?.name || str(r.name), category: ex?.category || str(r.category), cols: new Map(), files: new Set(), on: false };
        byCode.set(code, e);
      }
      e.files.add(f.name);
      const add = (v, suggested) => {
        const col = str(v?.col), val = str(v?.value).replace(/\\n/g, "\n");
        if (!col || !val || KEY_COL(col)) return;
        const arr = e.cols.get(col) || [];
        arr.push({ value: val, file: f.name, page: v.page, quote: str(v.quote), specificity: nModels, suggested });
        e.cols.set(col, arr);
      };
      (Array.isArray(r.values) ? r.values : []).forEach(v => add(v, false));
      (Array.isArray(r.new_cols) ? r.new_cols : []).forEach(v => add(v, true));
    }
  }
  const rows = [];
  for (const e of byCode.values()) {
    const ex = findModel(e.model);
    const cols = sheetsOf(spec).find(s => s.name === e.sheet)?.cols || [];
    const items = [];
    for (const [col, arr] of e.cols) {
      arr.sort((a, b) => a.specificity - b.specificity); // 모델이 적게 나온(개별) 카탈로그를 우선
      const best = arr[0], cur = ex ? str(ex.specs?.[col]) : "";
      const known = cols.includes(col) || (ex && col in (ex.specs || {}));
      const st = !known ? "newcol" : !cur ? "fill" : sameVal(cur, best.value) ? "same" : "diff";
      items.push({ id: uid("i"), col, value: best.value, cur, src: best, alts: arr.slice(1).filter(a => !sameVal(a.value, best.value)), st, on: st === "fill" });
    }
    const order = c => { const i = cols.indexOf(c); return i < 0 ? 999 : i; };
    items.sort((a, b) => order(a.col) - order(b.col));
    rows.push({ ...e, files: [...e.files], items });
  }
  rows.sort((a, b) => (a.isNew - b.isNew) || a.model.localeCompare(b.model));
  return rows;
}

async function applyCatalog() {
  const props = S.cat.props; if (!props?.length || !S.spec) return;
  const spec = clone(S.spec); spec.sheets = clone(sheetsOf(S.spec));
  let n = 0, added = 0;
  for (const r of props) {
    const picked = r.items.filter(i => i.on && i.st !== "same");
    if (!picked.length) continue;
    let m = spec.models.find(x => x.model === r.model);
    if (!m) {
      if (!r.on) continue;
      if (!spec.sheets.some(s => s.name === r.sheet)) spec.sheets.push({ name: r.sheet, cols: ["no.", "규격대조 우선순위", "제품군", "제품명", "모델명"] });
      m = { model: r.model, category: r.category, name: r.name, priority: null, sheet: r.sheet, specs: {} };
      spec.models.push(m); added++;
    }
    const sh = spec.sheets.find(s => s.name === sheetOfModel(spec, m));
    for (const i of picked) { m.specs[i.col] = i.value; n++; if (sh && !sh.cols.includes(i.col)) sh.cols.push(i.col); }
  }
  if (!n) return say("warn", "선택한 항목이 없어요.");
  spec.uploadedAt = new Date().toISOString();
  spec.catalogAt = spec.uploadedAt;
  try {
    await putRow("spec-previous", "spec", S.spec);
    await putRow("spec-current", "spec", spec);
    S.spec = spec; S.cat.props = null; S.cat.files = [];
    say("info", `카탈로그 값 ${n}개${added ? `(새 모델 ${added}개 포함)` : ""}를 스펙 DB에 저장했어요. 위의 [스펙 엑셀 받기]로 새 엑셀을 내려받아 앞으로의 원본으로 써 주세요.`);
  } catch { say("err", "스펙을 저장하지 못했어요. 다시 시도해 주세요."); }
}

const SPEC_RULES = [
  "렌탈 제품 스펙정리 — 작성 규칙",
  "",
  "1. 제품군마다 시트 하나: 정수기 / 공기청정기 / 비데. 새 제품군이 생기면 시트를 하나 더 만들고 1행 머리글에 '모델명' 칸을 꼭 넣는다.",
  "2. 1행은 머리글, 2행부터 한 줄 = 모델 하나. 새 모델은 맨 아래 줄에 추가한다.",
  "3. 한 칸에는 값 하나. 숫자는 숫자만 쓰고 단위는 머리글에 둔다. 예) 냉수(L) 칸에 7.1",
  "4. 있다/없다는 O 또는 X. 모르면 비워 둔다('기록중' 같은 글자는 쓰지 않는다).",
  "5. 셀 병합은 쓰지 않는다.",
  "6. 새 스펙 항목이 필요하면 그 제품군 시트 오른쪽 끝에 열을 추가한다.",
  "7. 규격대조 우선순위: 같은 조건이면 먼저 추천할 모델에 1 (그다음 2, 3...). 비우면 우선순위 없음. O를 쓰면 1로 본다.",
  "8. 모든 모델에 똑같은 내용은 '공통사항' 시트에 한 줄씩. 적용 제품군은 전체 / 정수기 / 공기청정기 / 비데.",
  "9. 다 고친 뒤 이 파일 전체를 규격대조 사이트 '제품 스펙' 탭에 올리면 통째로 반영된다.",
  "10. 사이트에서 카탈로그로 값을 채웠다면, 사이트의 [스펙 엑셀 받기]로 내려받은 파일을 새 원본으로 쓴다.",
];
async function exportSpec() {
  const spec = S.spec; if (!spec?.models?.length) return;
  if (!window.ExcelJS) return say("err", "엑셀 만들기 도구를 불러오지 못했어요. 새로고침 후 다시 해 주세요.");
  const wb = new ExcelJS.Workbook();
  const guide = wb.addWorksheet("작성 규칙");
  SPEC_RULES.forEach(l => guide.addRow([l]));
  guide.getColumn(1).width = 130; guide.getCell("A1").font = { bold: true, size: 14 };
  const toCell = v => { if (v == null || v === "") return null; const s = String(v); return /^-?\d+(\.\d+)?$/.test(s) ? Number(s) : s; };
  const thin = { style: "thin", color: { argb: "FFD7E0E1" } };
  const style = (ws, cols, keyCount) => {
    const hr = ws.getRow(1); hr.height = 42;
    hr.eachCell(c => { c.font = { bold: true, color: { argb: "FFFFFFFF" } }; c.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FF0A6A72" } }; c.alignment = { wrapText: true, vertical: "middle", horizontal: "center" }; c.border = { top: thin, left: thin, bottom: thin, right: thin }; });
    ws.eachRow((row, r) => { if (r === 1) return; for (let i = 1; i <= cols.length; i++) { const c = row.getCell(i); c.alignment = { wrapText: true, vertical: "top" }; c.border = { top: thin, left: thin, bottom: thin, right: thin }; if (i <= keyCount) c.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FFDCEFEE" } }; } });
    cols.forEach((h, i) => { let w = Math.max(6, Math.min(40, str(h).length * 1.6)); ws.eachRow((row, r) => { if (r > 1) { const v = str(row.getCell(i + 1).value); const l = Math.max(...v.split("\n").map(x => x.length)); w = Math.max(w, Math.min(40, l * 1.3)); } }); ws.getColumn(i + 1).width = Math.round(w); });
    ws.views = [{ state: "frozen", xSplit: keyCount, ySplit: 1 }];
  };
  for (const sh of sheetsOf(spec)) {
    const ms = spec.models.filter(m => sheetOfModel(spec, m) === sh.name);
    if (!ms.length) continue;
    const cols = [...sh.cols];
    if (!cols.some(c => KEY_COL(c) === "model")) cols.unshift("모델명");
    ms.forEach(m => Object.keys(m.specs || {}).forEach(k => { if (!cols.includes(k)) cols.push(k); }));
    const ws = wb.addWorksheet(sh.name.slice(0, 31));
    ws.addRow(cols);
    ms.forEach((m, i) => ws.addRow(cols.map(c => { const k = KEY_COL(c); return toCell(k === "no" ? i + 1 : k === "priority" ? m.priority : k === "category" ? m.category : k === "name" ? m.name : k === "model" ? m.model : m.specs?.[c]); })));
    style(ws, cols, cols.findIndex(c => KEY_COL(c) === "model") + 1);
  }
  if (spec.commons?.length) {
    const ws = wb.addWorksheet("공통사항"), cols = ["no.", "적용 제품군", "항목", "내용"];
    ws.addRow(cols); spec.commons.forEach((x, i) => ws.addRow([i + 1, x.scope, x.item, x.value]));
    style(ws, cols, 3);
  }
  for (const ref of spec.refs || []) { const ws = wb.addWorksheet(ref.name.slice(0, 31)); ref.rows.forEach(r => ws.addRow(r)); }
  const buf = await wb.xlsx.writeBuffer();
  const d = new Date(), name = `렌탈 제품 스펙정리_${d.getFullYear()}${p2(d.getMonth() + 1)}${p2(d.getDate())}.xlsx`;
  const url = URL.createObjectURL(new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
  const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}


/* ---------- 네트워크 점검: 크기·내용별로 저장이 되는지 시험 (전산팀 문의용) ---------- */
async function netProbe() {
  if (!S.sb || !S.me) return say("warn", "로그인한 뒤에 점검할 수 있어요.");
  const rnd = n => { let s = ""; const c = "abcdefghijklmnopqrstuvwxyz0123456789 "; while (s.length < n) s += c[(Math.random() * c.length) | 0]; return s; };
  const doc = n => { const base = "국토연구원 비데 정수기 공기청정기 구매 과업지시서 규격 냉수 탱크용량 6.0L 이상 점검주기 2개월 "; let s = ""; while (s.length < n) s += base; return s.slice(0, n); };
  const tests = [["영문 1KB", rnd(1000)], ["영문 20KB", rnd(20000)], ["영문 100KB", rnd(100000)], ["영문 500KB", rnd(500000)], ["입찰문서 같은 한글 1KB", doc(1000)], ["입찰문서 같은 한글 20KB", doc(20000)], ["입찰문서 같은 한글 100KB", doc(100000)]];
  const rows = [];
  S.busy = { label: "네트워크 점검 중", hint: "시험 데이터를 저장했다 지워요", start: Date.now(), ctl: new AbortController() }; render(true);
  for (const [name, text] of tests) {
    const id = "probe-" + uid("");
    let res;
    try {
      const { error } = await withTimeout(S.sb.from("bid_items").upsert({ id, kind: "probe", data: { text }, updated_at: new Date().toISOString(), user_id: S.me }, { onConflict: "user_id,id" }), 30000);
      res = error ? "실패: " + error.message : "성공";
    } catch (e) { res = "막힘: " + (e?.message || e?.code || e); }
    S.sb.from("bid_items").delete().eq("id", id).then(() => {}, () => {});
    rows.push(`${name} → ${res}`);
  }
  S.busy = null;
  rows.forEach(r => window.__diag?.("점검 " + r));
  say("info", "네트워크 점검이 끝났어요. 화면 아래 상자를 캡처해서 보내 주세요.");
}
/* ---------- auth & boot ---------- */
function showAuth(on) {
  $("#auth").hidden = !on;
  $("#who").hidden = on;
  if (on) setTimeout(() => $("#auEmail")?.focus(), 0);
}
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej({ code: "timeout", message: "timeout" }), ms))]);
async function currentSession() {
  if (S.session?.access_token && (S.session.expires_at || 0) * 1000 > Date.now() + 30000) return S.session;
  try { const { data } = await withTimeout(S.sb.auth.getSession(), 10000); if (data?.session) S.session = data.session; } catch {}
  return S.session || null;
}
async function start(session) {
  if (session) S.session = session;
  const s = await currentSession();
  const user = s?.user;
  if (!user) { S.me = null; showAuth(true); return false; }
  S.me = user.id; S.email = user.email || "";
  if (location.hash === "#setup") S.showSetup = true;
  if (/[?&]queue=1/.test(location.search)) S.viaQueue = true; // 집에서도 우회 경로를 시험해 볼 수 있게
  if (/[?&]probe=1/.test(location.search)) setTimeout(netProbe, 500);
  $("#whoEmail").textContent = S.email;
  showAuth(false);
  if (S.storageOk === false) S.msg = { type: "warn", text: "브라우저 저장공간이 가득 차서 로그인 상태를 저장하지 못했어요. 지금은 쓸 수 있지만, 페이지를 다시 열면 또 로그인해야 해요." };
  try { await loadAll(); S.setup = S.setup === "table" ? null : S.setup; }
  catch (e) {
    if (e?.code === "42P01" || e?.code === "PGRST205" || /bid_items/.test(e?.message || "")) S.setup = "table";
    else S.msg = { type: "err", text: "기록을 불러오지 못했어요. 새로고침해 주세요." };
    S.specLoaded = S.bidsLoaded = true;
  }
  render(true);
  return true;
}
$("#authForm").addEventListener("submit", async ev => {
  ev.preventDefault();
  const err = $("#authErr"), go = $("#authGo");
  err.hidden = true; go.disabled = true; go.textContent = "로그인 중…";
  let error, data;
  try {
    ({ data, error } = await withTimeout(S.sb.auth.signInWithPassword({ email: $("#auEmail").value.trim(), password: $("#auPw").value }), 20000));
  } catch (e) { error = e; }
  go.disabled = false; go.textContent = "로그인";
  if (error) {
    const m = error.message || "";
    err.textContent = error.code === "timeout" ? "서버 응답이 없어요. 워크노트 탭을 모두 닫고 이 페이지를 새로고침한 뒤 다시 해 주세요."
      : /invalid login/i.test(m) ? "이메일 또는 비밀번호가 맞지 않아요."
      : /not confirmed/i.test(m) ? "이메일 인증이 끝나지 않은 계정이에요."
      : `로그인하지 못했어요. (${m || "알 수 없는 오류"})`;
    err.hidden = false; return;
  }
  if (!data?.session) { err.textContent = `로그인은 됐는데 세션을 받지 못했어요. (${data?.user ? "사용자 확인됨, 세션 없음" : "응답 비어 있음"}) 이 문구를 캡처해서 알려주세요.`; err.hidden = false; return; }
  $("#auPw").value = "";
  const ok = await start(data.session);
  if (!ok) { err.textContent = "로그인 후 화면을 열지 못했어요. 새로고침해 주세요."; err.hidden = false; }
});
$("#logout").addEventListener("click", async () => {
  try { await withTimeout(S.sb.auth.signOut(), 8000); } catch {}
  Object.assign(S, { session: null, me: null, email: "", spec: null, bids: [], cur: null, files: [], pasted: "", specLoaded: false, bidsLoaded: false, setup: null, showSetup: false, msg: null });
  render(true); showAuth(true);
});

render(true);
if (!window.supabase?.createClient) {
  $("#main").innerHTML = `<div class="notice err"><div class="grow">로그인 도구를 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.</div></div>`;
} else {
  // 브라우저 저장공간(localStorage)이 가득 차거나 막혀 있어도 로그인이 유지되게, 실패하면 메모리에 보관
  const mem = new Map();
  const safeStorage = {
    getItem: k => { try { const v = localStorage.getItem(k); if (v != null) return v; } catch {} return mem.has(k) ? mem.get(k) : null; },
    setItem: (k, v) => { mem.set(k, v); try { localStorage.setItem(k, v); S.storageOk = true; } catch { S.storageOk = false; } },
    removeItem: k => { mem.delete(k); try { localStorage.removeItem(k); } catch {} },
  };
  S.sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false, storage: safeStorage } });
  S.sb.auth.onAuthStateChange((_event, session) => { S.session = session || null; });
  start();
}
</script>
