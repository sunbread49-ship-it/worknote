<!doctype html>
<html lang="en" translate="no" class="notranslate">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>bid-ai 함수 코드</title>
<style>
  body{margin:0;padding:20px 16px;font-family:'Malgun Gothic',system-ui,sans-serif;background:#f2f5f5;color:#14252a}
  .bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  button{font:inherit;font-weight:600;background:#0a6a72;color:#fff;border:0;border-radius:8px;padding:10px 18px;cursor:pointer}
  #msg{color:#16793a;font-weight:600}
  pre{background:#fff;border:1px solid #d7e0e1;border-radius:8px;padding:14px;overflow:auto;font:12.5px/1.5 Consolas,monospace;white-space:pre}
</style>
</head>
<body>
<div class="bar"><button id="copy">코드 전체 복사</button><span id="msg"></span></div>
<pre id="code" translate="no">불러오는 중…</pre>
<script>
const pre = document.getElementById("code"), msg = document.getElementById("msg");
fetch("bid-ai.ts?t=" + Date.now(), { cache: "no-store" }).then(r => r.text()).then(t => { pre.textContent = t; });
document.getElementById("copy").onclick = async () => {
  try { await navigator.clipboard.writeText(pre.textContent); msg.textContent = "복사했어요. Supabase Code 칸에 붙여넣으세요."; }
  catch { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); msg.textContent = "선택됐어요. Ctrl+C를 누르세요."; }
};
</script>
</body>
</html>
