# 새 지식 채널 (주식 악어새의 형제 채널)
name: "악어새 지식창고"
handle: "@악어새지식창고"
tagline: "악어새처럼, 어려운 지식에서 알맹이만 쏙쏙"
intro: |
  악어새가 악어 입속에서 쓸모 있는 것만 쏙쏙 골라내듯,
  어렵고 복잡한 과학 · 수학 · 역사 · 생활 원리에서 알맹이만 골라 쉽고 정확하게 풀어 드립니다.

  "왜 저럴까?" 싶었던 순간, 직접 계산하고 움직여서 눈으로 보여 드려요.
  궁금한 주제는 댓글로 남겨 주세요. 다음 지식창고에 쏙 넣어 두겠습니다.
cta: "더 재밌고 신기한 지식은, 채널 구독하고 우리 함께 봐요!"
character: "사용자 제공 일러스트 사용 (직접 생성하지 않음)"

# 쇼츠 화면 규칙 (첫 업로드 피드백 반영)
layout:
  bottom_ui_from_y: 1480     # 채널명 · 제목 · 홍보 버튼이 덮는 영역 (1080x1920 기준)
  centered: true             # 오른쪽 버튼 피해 왼쪽으로 옮기지 않음 — 정상 가운데 배치
  content_shift: 70          # 장면 내용 전체를 70px 내려 상단 고정 제목과 간격 확보
