<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>yj 워크노트</title>
<meta name="theme-color" content="#2D4BCB">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="워크노트">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF0EC; --surface:#FFFFFF; --surface-2:#F6F7F4; --ink:#1A1D23; --ink-2:#5E6470; --ink-3:#8C919B;
  --line:#DADDD6; --line-2:#E7E9E4; --accent:#2D4BCB; --accent-ink:#FFFFFF; --accent-soft:#E4E9FB;
  --hl:#F3D64B; --hl-soft:#FBF1BE; --danger:#C2412D; --danger-soft:#FBE5E0; --ok:#2E7D4F;
  --c1:#2D4BCB; --c2:#C2412D; --c3:#2E7D4F; --c4:#B7791F; --c5:#7A4FB5;
  --shadow:0 1px 2px rgba(20,24,40,.06),0 6px 24px rgba(20,24,40,.07);
  --sans:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#111317; --surface:#191C21; --surface-2:#1F2329; --ink:#E6E8EC; --ink-2:#A2A8B3; --ink-3:#737985;
  --line:#2C3038; --line-2:#252930; --accent:#8EA2FF; --accent-ink:#0F1320; --accent-soft:#232B4A;
  --hl:#D8BC3A; --hl-soft:#3A3417; --danger:#F08A76; --danger-soft:#3A221D; --ok:#6CC592;
  --c1:#8EA2FF; --c2:#F08A76; --c3:#6CC592; --c4:#E2B25A; --c5:#B89AF0;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111317; --surface:#191C21; --surface-2:#1F2329; --ink:#E6E8EC; --ink-2:#A2A8B3; --ink-3:#737985;
  --line:#2C3038; --line-2:#252930; --accent:#8EA2FF; --accent-ink:#0F1320; --accent-soft:#232B4A;
  --hl:#D8BC3A; --hl-soft:#3A3417; --danger:#F08A76; --danger-soft:#3A221D; --ok:#6CC592;
  --c1:#8EA2FF; --c2:#F08A76; --c3:#6CC592; --c4:#E2B25A; --c5:#B89AF0;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:0}
body{margin:0}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:216px 1fr;height:100%;min-height:0}
.side{border-right:1px solid var(--line);background:var(--surface-2);display:flex;flex-direction:column;padding:20px 12px;gap:18px;min-height:0}
.brand{font-weight:700;font-size:17px;padding:0 10px;display:flex;align-items:baseline;gap:6px;letter-spacing:-.01em}
.brand b{background:var(--hl);color:#1A1D23;padding:0 5px;border-radius:3px}
.brand span{color:var(--ink-2);font-weight:500;font-size:14px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--ink-2);font-weight:500;text-align:left}
.nav button:hover{background:var(--line-2);color:var(--ink)}
.nav button[aria-current="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.nav svg,.tabbar svg{width:18px;height:18px;flex:none}
.nav .count{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.nav .count.hot{color:var(--danger);font-weight:500}
.sync{margin-top:auto;font-size:12px;color:var(--ink-3);padding:0 10px;display:flex;align-items:center;gap:7px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3);flex:none}
.dot.on{background:var(--ok)} .dot.bad{background:var(--danger)}

main{min-width:0;min-height:0;overflow:auto;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);display:flex;align-items:center;gap:14px;padding:14px 28px;border-bottom:1px solid transparent}
.top h1{font-size:19px;font-weight:700;margin:0;letter-spacing:-.015em;white-space:nowrap}
.search{margin-left:auto;position:relative;width:min(320px,55%)}
.search input{width:100%;height:36px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:0 12px 0 34px;outline:none}
.search input:focus{border-color:var(--accent)}
.search svg{position:absolute;left:11px;top:10px;width:16px;height:16px;color:var(--ink-3)}
.view{padding:8px 28px 40px;flex:1}
.view[hidden]{display:none!important}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 13px;border-radius:8px;font-weight:500;font-size:13.5px;border:1px solid var(--line);background:var(--surface);white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--line-2);color:var(--ink)}
.btn.danger{color:var(--danger)}
.btn.armed{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.sm{height:28px;padding:0 9px;font-size:12.5px}
.field{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 11px;outline:none}
.field:focus{border-color:var(--accent)}
textarea.field{resize:vertical;min-height:70px}
label.lb{font-size:12px;color:var(--ink-2);font-weight:500;display:block;margin-bottom:4px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-width:0}
.panel h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin:0 0 10px;font-weight:600;display:flex;align-items:center;gap:8px}
.panel h2 .more{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:500;color:var(--accent);font-size:12.5px}
.empty{color:var(--ink-3);font-size:13px;padding:6px 0}

/* home */
.today-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;padding:6px 0 18px}
.today-head .date{font-size:30px;font-weight:700;letter-spacing:-.025em;line-height:1.1}
.today-head .date em{font-style:normal;background:linear-gradient(transparent 58%,var(--hl) 58%,var(--hl) 92%,transparent 92%);padding:0 2px}
.today-head .meta{color:var(--ink-2);font-size:13px;padding-bottom:3px}
.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.home-grid .wide{grid-column:1/-1}
.quick{display:flex;gap:8px;align-items:flex-start}
.quick textarea{min-height:44px;height:44px;flex:1}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.ncard{text-align:left;border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:var(--surface-2);display:flex;flex-direction:column;gap:4px;min-height:92px;overflow:hidden}
.ncard:hover{border-color:var(--ink-3)}
.ncard .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ncard .s{font-size:12.5px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ncard .d{margin-top:auto;font-size:11.5px;color:var(--ink-3)}
.ncard img{width:100%;height:84px;object-fit:cover;border-radius:6px;background:var(--line-2)}
.sample{border:1px dashed var(--line);border-radius:12px;padding:18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;color:var(--ink-2)}

/* lists */
.ev{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line-2);text-align:left;width:100%}
.ev:first-child{border-top:0}
.ev .time{font-family:var(--mono);font-size:12.5px;color:var(--ink-2);width:86px;flex:none;padding-top:1px}
.ev .bar{width:3px;align-self:stretch;border-radius:2px;flex:none}
.ev .tt{font-weight:500;min-width:0;overflow-wrap:anywhere}
.ev .sub{font-size:12px;color:var(--ink-3)}
.todo{display:flex;gap:10px;align-items:flex-start;padding:8px 2px;border-top:1px solid var(--line-2)}
.todo:first-child{border-top:0}
.chk{width:19px;height:19px;border:1.6px solid var(--ink-3);border-radius:5px;flex:none;margin-top:1px;display:grid;place-items:center}
.chk:hover{border-color:var(--accent)}
.todo.done .chk{background:var(--ok);border-color:var(--ok)}
.chk svg{width:12px;height:12px;color:#fff;opacity:0}
.todo.done .chk svg{opacity:1}
.todo .body{flex:1;min-width:0;text-align:left}
.todo .tx{overflow-wrap:anywhere}
.todo.done .tx{color:var(--ink-3);text-decoration:line-through}
.todo .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.chip{font-family:var(--mono);font-size:11.5px;padding:1px 7px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line-2);color:var(--ink-2);display:inline-flex;align-items:center;gap:4px}
.chip.late{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.chip.today{background:var(--hl-soft);color:var(--ink);border-color:transparent}
.chip svg{width:11px;height:11px}
.grp{font-size:12px;font-weight:600;color:var(--ink-2);margin:18px 0 4px;display:flex;gap:8px;align-items:center}
.grp .n{font-family:var(--mono);font-weight:400;color:var(--ink-3)}
.grp.late{color:var(--danger)}

/* todos */
.tq{display:flex;gap:8px;flex-wrap:wrap}
.tq input{flex:1;min-width:200px;height:40px}
.hint{font-size:12.5px;color:var(--ink-3);margin-top:6px;min-height:19px}
.hint b{color:var(--accent);font-weight:500}
.todo-wrap{max-width:760px}

/* notes */
.notes-layout{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start;min-height:0}
.nlist{display:flex;flex-direction:column;gap:6px}
.nitem{text-align:left;padding:10px 12px;border-radius:9px;border:1px solid transparent;display:flex;gap:10px}
.nitem:hover{background:var(--surface)}
.nitem.on{background:var(--surface);border-color:var(--line)}
.nitem .tx{flex:1;min-width:0}
.nitem .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nitem .s{font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nitem .d{font-size:11.5px;color:var(--ink-3);display:flex;gap:8px}
.nitem img{width:46px;height:46px;border-radius:6px;object-fit:cover;flex:none;background:var(--line-2)}
.pin{color:var(--c4)}
.editor{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 24px 26px;min-height:60vh;min-width:0}
.ed-top{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.ed-top .st{font-size:12px;color:var(--ink-3);margin-right:auto}
.ed-back{display:none}
.ed-title{width:100%;border:0;outline:none;background:transparent;font-size:24px;font-weight:700;letter-spacing:-.02em;padding:6px 0}
.ed-tags{width:100%;border:0;outline:none;background:transparent;font-size:13px;color:var(--accent);padding:2px 0 10px;border-bottom:1px solid var(--line-2)}
.ed-body{width:100%;border:0;outline:none;background:transparent;resize:none;min-height:180px;padding:14px 0;line-height:1.7;font-size:15px;overflow:hidden}
.ed-sec{display:flex;align-items:center;gap:8px;margin:12px 0 10px;padding-top:14px;border-top:1px solid var(--line-2)}
.ed-sec h3{margin:0;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.ed-sec .btn{margin-left:auto}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.ph{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface-2);display:flex;flex-direction:column;position:relative}
.ph img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;cursor:zoom-in;background:var(--line-2)}
.ph textarea{border:0;border-top:1px solid var(--line-2);background:transparent;outline:none;resize:none;padding:8px 10px;font-size:13px;min-height:58px}
.ph .x{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:7px;background:rgba(20,22,28,.6);color:#fff;display:grid;place-items:center;font-size:15px;line-height:1}
.ph .x.armed{background:var(--danger)}
.ph.uploading{opacity:.55}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:16px;text-align:center;color:var(--ink-3);font-size:13px}
.drop.over{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.ed-empty{display:grid;place-items:center;min-height:50vh;color:var(--ink-3);text-align:center;gap:10px}

/* calendar */
.cal-layout{display:grid;grid-template-columns:1fr 300px;gap:16px;align-items:start}
.cal-head{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.cal-head .m{font-size:18px;font-weight:700;margin-right:auto;letter-spacing:-.01em}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line);background:var(--surface);border-radius:10px;overflow:hidden}
.cal .wd{font-size:11.5px;color:var(--ink-2);padding:6px 8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface-2);font-weight:600}
.cal .wd:first-child{color:var(--danger)}
.cell{min-height:96px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0;overflow:hidden}
.cell:hover{background:var(--surface-2)}
.cell.out{background:var(--surface-2)} .cell.out .n{color:var(--ink-3)}
.cell.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.cell .n{font-family:var(--mono);font-size:12.5px;align-self:flex-start;padding:0 4px;border-radius:4px}
.cell.sun .n{color:var(--danger)}
.cell.today .n{background:var(--hl);color:#1A1D23;font-weight:500}
.cell .e{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 5px;border-radius:4px;border-left:3px solid;background:var(--surface-2)}
.cell .more{font-size:11px;color:var(--ink-3);padding-left:4px}
.cell .dots{display:none;gap:3px;flex-wrap:wrap;padding-left:4px}
.cell .dots i{width:6px;height:6px;border-radius:50%}
.cell .tdn{font-size:11px;color:var(--ink-3);padding-left:4px;font-family:var(--mono)}

/* files */
.fl-top{display:flex;gap:14px;align-items:stretch;flex-wrap:wrap;margin-bottom:14px}
.fl-top .drop{flex:1;min-width:240px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.meter{min-width:220px;display:flex;flex-direction:column;justify-content:center;gap:6px}
.meter .bar{height:6px;background:var(--line-2);border-radius:3px;overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--accent)}
.meter .tx{font-size:12px;color:var(--ink-2)}
.ftable{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.ftable td{padding:10px 12px;border-top:1px solid var(--line-2);vertical-align:middle}
.ftable tr:first-child td{border-top:0}
.ftype{font-family:var(--mono);font-size:11px;font-weight:500;width:44px;height:28px;border-radius:6px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);text-transform:uppercase}
.fname{font-weight:500;overflow-wrap:anywhere}
.fsub{font-size:12px;color:var(--ink-3)}
.facts{white-space:nowrap;text-align:right}
.fmemo{width:100%;border:0;background:transparent;outline:none;font-size:12.5px;color:var(--ink-2);padding:2px 0}
.fmemo:focus{color:var(--ink)}

/* search */
.sres{display:flex;flex-direction:column;gap:18px;max-width:760px}
.sres .it{display:block;text-align:left;width:100%;padding:9px 12px;border-radius:8px;background:var(--surface);border:1px solid var(--line);margin-top:6px}
.sres .it:hover{border-color:var(--ink-3)}
mark{background:var(--hl-soft);color:inherit;border-radius:2px}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:40;background:rgba(10,12,18,.42);display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:var(--surface);border-radius:14px;width:min(460px,100%);max-height:calc(100% - 20px);overflow:auto;padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.sheet h3{margin:0;font-size:16px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1;min-width:120px}
.sw{display:flex;gap:8px}
.sw button{width:26px;height:26px;border-radius:50%;border:2px solid transparent}
.sw button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.sheet .acts{display:flex;gap:8px;margin-top:4px}
.sheet .acts .sp{margin-right:auto}
.tog{display:flex;align-items:center;gap:8px;font-size:13.5px}
.tog input{width:17px;height:17px;accent-color:var(--accent)}

/* lightbox */
.lbox{position:fixed;inset:0;z-index:50;background:rgba(8,9,12,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:12px}
.lbox img{max-width:100%;max-height:calc(100% - 80px);object-fit:contain;border-radius:6px}
.lbox p{color:#e8e8e8;margin:0;max-width:680px;text-align:center;white-space:pre-wrap}
.lbox .close{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:14px;color:#fff;font-size:26px;width:40px;height:40px}

/* alerts + toast */
#alerts{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:14px;z-index:60;display:flex;flex-direction:column;gap:10px;width:min(340px,calc(100% - 28px))}
.al{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--hl);border-radius:12px;box-shadow:var(--shadow);padding:13px 14px;display:flex;flex-direction:column;gap:8px;animation:pop .25s ease-out}
.al .k{font-size:11.5px;color:var(--ink-2);font-weight:600;letter-spacing:.04em;display:flex;gap:6px;align-items:center}
.al .k svg{width:14px;height:14px;color:var(--c4)}
.al .m{font-weight:600;font-size:15px;overflow-wrap:anywhere}
.al .a{display:flex;gap:6px;flex-wrap:wrap}
@keyframes pop{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.al{animation:none}}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:9px;font-size:13.5px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.banner{margin:0 28px 10px;padding:10px 14px;border-radius:10px;background:var(--danger-soft);color:var(--danger);font-size:13px}

.tabbar{display:none}
.fab{display:none}

@media (max-width:1020px){
  .cal-layout{grid-template-columns:1fr}
  .notes-layout{grid-template-columns:250px 1fr}
}
@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:1fr auto}
  .side{display:none}
  .top{padding:12px 16px}
  .top h1{font-size:18px}
  .view{padding:6px 16px 28px}
  .banner{margin:0 16px 10px}
  .home-grid{grid-template-columns:1fr}
  .today-head .date{font-size:25px}
  .notes-layout{grid-template-columns:1fr}
  .notes-layout.editing .nlist-wrap{display:none}

function parseQuick(txt){
  let t = ' ' + txt + ' ', date = null, hh = null, mm = 0; const now = new Date();
  const rel = { '오늘':0, '내일':1, '모레':2, '글피':3 };
  for (const k in rel) { const re = new RegExp('\\s' + k + '(?=\\s)'); if (re.test(t)) { date = addDays(now, rel[k]); t = t.replace(re, ' '); } }
  let m = t.match(/\s(다음\s?주\s*)?([월화수목금토일])요일(?=\s)/);
  if (m) { const target = WD.indexOf(m[2]); let n = (target - now.getDay() + 7) % 7; if (m[1]) n += 7; else if (n === 0) n = 7; date = addDays(now, n); t = t.replace(m[0], ' '); }
  m = t.match(/\s(\d{1,2})[\/.](\d{1,2})(?=\s)/);
  if (m) { const mo = +m[1], da = +m[2]; if (mo >= 1 && mo <= 12 && da >= 1 && da <= 31) { date = new Date(now.getFullYear(), mo-1, da); if (date < addDays(now,-60)) date.setFullYear(date.getFullYear()+1); t = t.replace(m[0], ' '); } }
  m = t.match(/\s(오전|오후|아침|저녁|밤)?\s?(\d{1,2})시(\s?(\d{1,2})분|\s?반)?(?=\s)/);
  if (m) { hh = +m[2]; mm = m[4] ? +m[4] : m[3] ? 30 : 0; if (/오후|저녁|밤/.test(m[1]||'') && hh < 12) hh += 12; else if (!m[1] && hh >= 1 && hh <= 7) hh += 12; if (/오전|아침/.test(m[1]||'') && hh === 12) hh = 0; t = t.replace(m[0], ' '); }
  else { m = t.match(/\s(\d{1,2}):(\d{2})(?=\s)/); if (m) { hh = +m[1]; mm = +m[2]; t = t.replace(m[0], ' '); } }
  if (hh !== null && hh > 23) hh = null;
  if (hh !== null && !date) { date = new Date(now); const probe = new Date(now); probe.setHours(hh, mm, 0, 0); if (probe < now) date = addDays(now, 1); }
  const text = t.replace(/\s+/g,' ').trim();
  const due = date ? dkey(date) + (hh !== null ? `T${pad(hh)}:${pad(mm)}` : '') : '';
  return { text: text || txt.trim(), due, remind: hh !== null };
}

/* ---------- files ---------- */
function extOf(n){ const p = (n||'').split('.'); return p.length > 1 ? p.pop().toLowerCase() : ''; }
function fileTable(list, compact){
  if (!list.length) return '<div class="empty" style="padding:14px 2px">아직 올린 파일이 없어요.</div>';
  return `<div style="overflow-x:auto"><table class="ftable"><tbody>${list.map(f => {
    const ext = extOf(f.name) || 'file';
    const img = /^image\//.test(f.type);
    return `<tr>
      <td style="width:56px">${img ? imgTag(f.asset, `style="width:44px;height:36px;object-fit:cover;border-radius:6px;cursor:zoom-in" data-act="file-view" data-id="${f.id}"`) : `<span class="ftype">${esc(ext.slice(0,4))}</span>`}</td>
      <td><div class="fname">${esc(f.name)}</div>
        ${compact ? `<div class="fsub mono">${fmtSize(f.size)} · ${relTime(f.createdAt)}</div>` : `<input class="fmemo" data-fmemo="${f.id}" value="${esc(f.memo||'')}" placeholder="메모 달기…" aria-label="파일 메모">`}</td>
      ${compact ? '' : `<td class="fsub mono hide-sm" style="white-space:nowrap">${fmtSize(f.size)}<br>${relTime(f.createdAt)}</td>`}
      <td class="facts">
        ${(img || f.type === 'application/pdf' || /^video\//.test(f.type)) ? `<button class="btn ghost sm" data-act="file-open" data-id="${f.id}">열기</button>` : ''}
        <button class="btn ghost sm" data-act="file-dl" data-id="${f.id}">받기</button>
        ${compact ? '' : `<button class="btn ghost sm danger" data-act="file-del" data-id="${f.id}">삭제</button>`}
      </td></tr>`;
  }).join('')}</tbody></table></div>`;
}
function renderFiles(){
  const list = [...S.files].sort((a,b) => String(b.createdAt).localeCompare(String(a.createdAt)));
  const focused = document.activeElement && document.activeElement.dataset && document.activeElement.dataset.fmemo;
  if (!focused) $('#fileList').innerHTML = fileTable(list, false);
  const used = S.files.reduce((s,f) => s + (f.size||0), 0);
  const pct = Math.min(100, used / (1024**3) * 100);
  $('#meter').innerHTML = `<div class="tx">파일함 사용량 <span class="mono">${fmtSize(used)} / 1GB</span></div><div class="bar"><i style="width:${pct.toFixed(1)}%"></i></div><div class="tx mono">${S.files.length}개 (메모 사진은 별도)</div>`;
}
async function uploadFiles(list){
  for (const f of [...list]) {
    if (f.size > 50 * 1048576) { toast(`${f.name}: 50MB를 넘어서 올릴 수 없어요.`); continue; }
    toast(`${f.name} 올리는 중…`);
    try {
      const path = await uploadBlob(f, f.name);
      await put('files', rid(), { name:f.name, asset:path, size:f.size, type:f.type || 'application/octet-stream', memo:'', createdAt:nowISO() });
      toast(`${f.name} 올렸어요.`);
    } catch(e){ toast(uploadMsg(e, f.name)); }
  }
}
async function downloadFile(f){
  const { data, error } = await sb.storage.from(BUCKET).createSignedUrl(f.asset, 300, { download: f.name });
  if (error || !data) { toast('파일을 찾을 수 없어요.'); return; }
  const a = document.createElement('a'); a.href = data.signedUrl; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove();
}
async function openFile(f){
  const [u] = await signedUrls([f.asset]);
  if (!u) { toast('파일을 찾을 수 없어요.'); return; }
  if (/^image\//.test(f.type)) lightbox(u, f.memo || f.name);
  else window.open(u, '_blank', 'noopener');
}

let actx = null;
document.addEventListener('pointerdown', () => { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch {} } }, { once:true });
function ding(){ if (!actx) return; try { const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain(); o.type = 'sine'; o.frequency.setValueAtTime(880, t); o.frequency.setValueAtTime(1318, t + .14); g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.22, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + .6); o.connect(g).connect(actx.destination); o.start(t); o.stop(t + .65); } catch {} }
const fired = new Set(ls.get('wn.fired', []));
const baseTitle = document.title; let unseen = 0;
function markFired(k){ fired.add(k); ls.set('wn.fired', [...fired].slice(-300)); }
function checkReminders(){
  if (!loaded) return;
  const now = Date.now();
  S.todos.forEach(t => {
    if (t.done || !t.remind || !hasTime(t.due)) return;
    const at = dueDate(t.due).getTime(), k = 't:' + t.id + ':' + t.due;
    if (at <= now && now - at < 12 * 3600e3 && !fired.has(k)) { markFired(k); showAlert('할 일', t.text, dueLabel(t.due), [['완료', 'al-done', t.id], ['10분 뒤', 'al-snooze', t.id]], 't' + t.id); }
  });
  S.events.forEach(e => {
    if (e.alarm == null || e.alarm < 0) return;
    const start = new Date(e.date + 'T' + (e.allDay || !e.start ? '09:00' : e.start)).getTime();
    const at = start - e.alarm * 60e3, k = 'e:' + e.id + ':' + e.date + e.start + e.alarm;
    if (at <= now && now - start < 3600e3 && !fired.has(k)) { markFired(k); showAlert('일정', e.title, `${fmtMD(e.date)} ${evTime(e)}`, [['보기', 'al-event', e.id]], 'e' + e.id); }
  });
}
async function sysNotify(title, body, tag){
  try {
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration();
    if (reg) reg.showNotification(title, { body, tag, icon:'icon-192.png', badge:'icon-192.png' });
    else new Notification(title, { body, tag, icon:'icon-192.png' });
  } catch {}
}
function showAlert(kind, msg, when, acts, tag){
  const el = document.createElement('div'); el.className = 'al';
  el.innerHTML = `<div class="k">${IC.bell}${kind} · <span class="mono">${esc(when)}</span></div><div class="m">${esc(msg)}</div>
    <div class="a">${acts.map(([l,a,id]) => `<button class="btn sm${a === 'al-done' ? ' primary' : ''}" data-act="${a}" data-id="${id}">${l}</button>`).join('')}<button class="btn sm ghost" data-act="al-close">닫기</button></div>`;
  $('#alerts').prepend(el); ding();
  if (document.hidden) { unseen++; document.title = `(${unseen}) 알림 · ${baseTitle}`; }
  sysNotify(`${kind} · ${when}`, msg, tag);
}

document.addEventListener('click', async ev => {

  const act = a.dataset.act, id = a.dataset.id;
  const find = (arr) => arr.find(x => x.id === id);
  switch (act) {
    case 'toggle-todo': { const t = find(S.todos); if (t) await put('todos', id, { ...strip(t), done:!t.done, doneAt: t.done ? '' : nowISO() }); break; }
    case 'edit-todo': { const t = find(S.todos); if (t) todoSheet(t); break; }
    case 'open-note': openNote(id); break;
    case 'new-note': newNote(); break;
    case 'close-note': flushNote(); ed = null; renderNotes(); break;
    case 'pin-note': ed.draft.pinned = !ed.draft.pinned; a.textContent = ed.draft.pinned ? '고정 해제' : '고정'; noteChanged(); break;
    case 'note-todo': { const t = ed.draft.title || snippet(ed.draft).slice(0,40); if (!t) { toast('먼저 제목을 적어주세요.'); break; } todoSheet(null, ''); $('#stText').value = t; break; }
    case 'del-note': {
      if (!armed(a)) break;
      const nid = ed.id, photos = (ed.draft.photos||[]).map(p => p.asset);
      clearTimeout(ed.timer); ed = null; await del('notes', nid);
      removeBlobs(photos).catch(() => {});
      renderNotes(); toast('메모를 삭제했어요.'); break;
    }
    case 'add-photo': $('#photoInput').click(); break;
    case 'del-photo': {
      if (!armed(a)) break;
      const i = +a.dataset.i, p = ed.draft.photos[i]; ed.draft.photos.splice(i,1); drawPhotos(); noteChanged();
      if (p && p.asset) removeBlobs([p.asset]).catch(() => {});
      break;
    }
    case 'zoom': { const p = ed.draft.photos[+a.dataset.i]; if (p && !p.uploading) { const [u] = await signedUrls([p.asset]); if (u) lightbox(u, p.caption); } break; }
    case 'close-lb': $('#lightbox').hidden = true; break;

    case 'al-done': { const t = find(S.todos); a.closest('.al').remove(); if (t) await put('todos', id, { ...strip(t), done:true, doneAt:nowISO() }); toast('완료했어요.'); break; }
    case 'al-snooze': {

  const now = new Date(), ts = nowISO(), tk = todayKey(), tm = dkey(addDays(now,1));
  put('notes', rid(), { title:'주간 회의 메모 (예시)', body:'- 3분기 B2B 신규 계약 현황 공유\n- 거래처별 견적 회신 기한 정리 필요\n- 다음 주 월요일까지 제안서 초안\n\n캡처는 이 화면에 붙여넣기 하면 사진으로 붙어요.', tags:['회의','예시'], photos:[], pinned:true, createdAt:ts, updatedAt:ts });
  put('notes', rid(), { title:'스터디: 엑셀 피벗 단축키 (예시)', body:'Alt → N → V : 피벗 테이블 삽입\nCtrl + T : 표로 변환\nAlt + F5 : 새로 고침', tags:['스터디','예시'], photos:[], pinned:false, createdAt:ts, updatedAt:ts });
  addTodo({ text:'거래처 견적서 회신 (예시)', due: tk + 'T' + pad(Math.min(23, now.getHours() + 2)) + ':00', remind:true });
  addTodo({ text:'주간 보고 작성 (예시)', due: tm, remind:false });
  addTodo({ text:'명함 정리 (예시)', due:'', remind:false });
  put('events', rid(), { title:'팀 주간회의 (예시)', date: tm, allDay:false, start:'10:00', end:'11:00', color:'c1', alarm:10, memo:'회의실 3', createdAt:ts });
  put('events', rid(), { title:'고객사 미팅 (예시)', date: dkey(addDays(now,3)), allDay:false, start:'14:00', end:'15:30', color:'c2', alarm:30, memo:'', createdAt:ts });
  toast('예시를 넣었어요. 필요 없으면 하나씩 지우면 돼요.');
});

/* ---------- sync ---------- */
function setSync(state){
  const d = $('#syncDot'), t = $('#syncTx');
  d.className = 'dot' + (state === 'on' ? ' on' : state === 'bad' ? ' bad' : '');
  t.textContent = state === 'on' ? '실시간 동기화 중' : state === 'bad' ? '연결 안 됨' : '연결 중…';
}
let channel = null;
function subscribe(){
  if (channel) sb.removeChannel(channel);
  channel = sb.channel('items-' + me.id)
    .on('postgres_changes', { event:'*', schema:'public', table:'items' }, payload => {
      if (payload.eventType === 'DELETE') { dropRow(payload.old.id); }
      else {
        const row = payload.new;
        const w = writers[row.id];
        if (w && (w.busy || w.next)) return; // our own write in flight: keep local copy
        applyRow(row);
        if (row.kind === 'notes' && ed && ed.id === row.id) syncEditorFromRemote();
      }
      render(); checkReminders();
    })
    .subscribe(status => { if (status === 'SUBSCRIBED') setSync('on'); else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED') setSync('bad'); });
}
async function refresh(){
  try { await loadAll(); render(); checkReminders(); if (!channel || channel.state !== 'joined') subscribe(); }
  catch(e){ console.error(e); setSync('bad'); }
}
function syncEditorFromRemote(){
  const n = S.notes.find(x => x.id === ed.id);
  if (!n) return;
  if (ed.timer || (document.activeElement && $('#editor').contains(document.activeElement))) return;
  if ((ed.draft.photos||[]).some(p => p.uploading)) return;
  if (n.updatedAt && n.updatedAt !== ed.draft.updatedAt) { ed.draft = JSON.parse(JSON.stringify(n)); delete ed.draft.id; ed.saved = true; drawEditor(); }
}

/* ---------- auth ---------- */
let signupMode = false;
function showAuth(on){ $('#auth').hidden = !on; }
$('#authSwitch').onclick = () => {
  signupMode = !signupMode;
  $('#authGo').textContent = signupMode ? '계정 만들기' : '로그인';
  $('#authSwitch').textContent = signupMode ? '이미 계정이 있어요 · 로그인' : '처음이에요 · 계정 만들기';
  $('#authSub').textContent = signupMode ? '워크노트 전용 계정을 만들어요. 비밀번호는 8자 이상.' : '이메일과 비밀번호로 로그인하세요.';
  $('#auPw').autocomplete = signupMode ? 'new-password' : 'current-password';
  $('#authErr').hidden = true;
};
$('#authForm').addEventListener('submit', async e => {
  e.preventDefault();
  const email = $('#auEmail').value.trim(), password = $('#auPw').value;
  const err = $('#authErr'); err.hidden = true;
  $('#authGo').disabled = true;
  const res = signupMode ? await sb.auth.signUp({ email, password }) : await sb.auth.signInWithPassword({ email, password });
  $('#authGo').disabled = false;
  if (res.error) {
    const m = res.error.message || '';
    err.textContent = /invalid login/i.test(m) ? '이메일 또는 비밀번호가 맞지 않아요.'
      : /not allowed|disabled/i.test(m) ? '새 계정 만들기는 막혀 있어요. 기존 계정으로 로그인하세요.'
      : /already registered/i.test(m) ? '이미 있는 계정이에요. 로그인하세요.'
      : /password/i.test(m) ? '비밀번호는 8자 이상이어야 해요.'
      : '문제가 생겼어요: ' + m;
    err.hidden = false; return;
  }
  if (signupMode && !res.data.session) { err.textContent = '메일함에서 인증 링크를 누른 뒤 로그인하세요.'; err.hidden = false; }
});
async function logout(){ await sb.auth.signOut(); location.reload(); }
let started = false;
async function start(user){
  me = user; showAuth(false);
  if (started) return; started = true;
  setSync('');
  await refresh();
  subscribe();
}
sb.auth.onAuthStateChange((evt, session) => {
  if (session && session.user) setTimeout(() => start(session.user), 0);
  else if (evt === 'SIGNED_OUT' || evt === 'INITIAL_SESSION') { if (!session) showAuth(true); }
});

/* ---------- boot ---------- */
buildNav();
updateNotifBtn();
const startView = (() => { const h = (location.hash || '').slice(1); if (VIEWS.some(v => v[0] === h)) return h; const s = ls.get('wn.view','home'); return VIEWS.some(v => v[0] === s) ? s : 'home'; })();
go(startView);
setInterval(() => { checkReminders(); if (view === 'home' || view === 'todos') render(); }, 20000);
let lastDay = todayKey();
setInterval(() => { if (todayKey() !== lastDay) { lastDay = todayKey(); render(); } }, 60000);
})();
</script>
